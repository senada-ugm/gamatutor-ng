<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132d47"/>
      <stop offset="45%" stop-color="#173a5e"/>
      <stop offset="80%" stop-color="#2d77c2"/>
      <stop offset="100%" stop-color="#5bb4b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fd9d4" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2d77c2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2d77c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="42%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#bdeeea"/>
      <stop offset="35%" stop-color="#5bb4b2"/>
      <stop offset="75%" stop-color="#2d77c2"/>
      <stop offset="100%" stop-color="#132d47"/>
    </radialGradient>
    <radialGradient id="pupil" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0d1f33"/>
      <stop offset="100%" stop-color="#050c15"/>
    </radialGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf6f6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#eaf6f6" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- soft glow spotlight behind the eye -->
  <circle cx="1080" cy="380" r="480" fill="url(#glow)"/>

  <!-- faint clinical grid texture, upper right -->
  <g stroke="#eaf6f6" stroke-opacity="0.06" stroke-width="1">
    <path d="M1100 0 V900 M1180 0 V900 M1260 0 V900 M1340 0 V900 M1420 0 V900 M1500 0 V900"/>
    <path d="M900 60 H1600 M900 140 H1600 M900 220 H1600 M900 300 H1600 M900 380 H1600 M900 460 H1600 M900 540 H1600 M900 620 H1600 M900 700 H1600 M900 780 H1600"/>
  </g>

  <!-- retinal vessel-like branching lines, radiating from the eye toward upper right -->
  <g fill="none" stroke="#eaf6f6" stroke-opacity="0.22" stroke-width="2.2" stroke-linecap="round">
    <path d="M1080 380 C 1220 300, 1300 250, 1460 160"/>
    <path d="M1300 250 C 1360 210, 1420 190, 1500 210"/>
    <path d="M1080 380 C 1240 420, 1360 400, 1500 460"/>
    <path d="M1360 400 C 1420 430, 1460 470, 1520 480"/>
    <path d="M1080 380 C 1160 470, 1180 560, 1150 660"/>
    <path d="M1180 560 C 1230 600, 1270 610, 1320 650"/>
  </g>
  <g fill="#bdeeea" fill-opacity="0.55">
    <circle cx="1460" cy="160" r="4.5"/>
    <circle cx="1500" cy="210" r="3.5"/>
    <circle cx="1500" cy="460" r="4"/>
    <circle cx="1520" cy="480" r="3"/>
    <circle cx="1150" cy="660" r="4"/>
    <circle cx="1320" cy="650" r="3.5"/>
  </g>

  <!-- concentric scan rings suggesting a screening exam -->
  <g fill="none" stroke="#eaf6f6" stroke-opacity="0.28">
    <circle cx="1080" cy="380" r="230" stroke-width="1.4" stroke-dasharray="2 10"/>
    <circle cx="1080" cy="380" r="300" stroke-width="1.2" stroke-dasharray="2 14"/>
    <circle cx="1080" cy="380" r="370" stroke-width="1" stroke-dasharray="1 18"/>
  </g>

  <!-- stylised eye -->
  <g>
    <path d="M 870 380 C 950 270, 1220 270, 1300 380 C 1220 490, 950 490, 870 380 Z" fill="url(#lidGrad)"/>
    <path d="M 870 380 C 950 270, 1220 270, 1300 380 C 1220 490, 950 490, 870 380 Z" fill="none" stroke="#173a5e" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="1085" cy="380" r="98" fill="url(#iris)"/>
    <circle cx="1085" cy="380" r="98" fill="none" stroke="#0d2338" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="1085" cy="380" r="46" fill="url(#pupil)"/>
    <circle cx="1062" cy="356" r="14" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="1108" cy="402" r="6" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <!-- lower-left kept clear and darker for readable overlay text -->
  <rect x="0" y="0" width="720" height="900" fill="#0f2438" fill-opacity="0.28"/>
</svg>
