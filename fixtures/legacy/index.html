<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIVE — Skrining Retinopati Diabetika (gaya course IDF)</title>
<style>
:root{
  --teal:#5bb4b2; --blue-mid:#2d77c2; --navy:#173a5e; --navy-deep:#132d47;
  --sidebar-inactive-bg:#dcdcdc; --sidebar-inactive-text:#8b8b8b;
  --card-bg:#ffffff; --page-bg:#eef1f4; --line-light:#e2e6ea;
  --good:#2c7a4b; --bad:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--page-bg);color:#233;}
.app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{width:280px;flex:0 0 280px;background:#fff;display:flex;flex-direction:column;box-shadow:2px 0 10px rgba(0,0,0,.05);}
.sidebar-head{background:linear-gradient(120deg,var(--teal) 0%,var(--blue-mid) 65%,var(--navy) 100%);
              color:#fff;padding:16px 18px 20px;position:relative;}
.sidebar-head .top-icons{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;margin-bottom:14px;}
.sidebar-head .brand{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.brand-mark{width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
.sidebar-head .course-title{font-size:15px;font-weight:700;line-height:1.35;}
.steps{list-style:none;margin:0;padding:0;}
.step{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;background:var(--sidebar-inactive-bg);
      color:var(--sidebar-inactive-text);border-bottom:1px solid #cfcfcf;font-size:13.5px;font-weight:600;transition:.15s;}
.step .num{font-weight:700;width:16px;flex:0 0 16px;}
.step .play{width:26px;height:26px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 26px;}
.step.active{background:var(--blue-mid);color:#fff;}
.step.active .play{background:#fff;color:var(--blue-mid);}
.step.done .play{background:var(--good);}
.step:hover{filter:brightness(0.97);}
.step.locked{cursor:not-allowed;opacity:.6;}
.step.locked .play{background:#999;}
.step.locked:hover{filter:none;}

/* ---------- MAIN / CONTENT ---------- */
.main{flex:1;display:flex;flex-direction:column;padding:26px 30px;}
.content-card{background:var(--card-bg);border-radius:4px;box-shadow:0 2px 14px rgba(20,40,60,.08);flex:1;display:flex;flex-direction:column;overflow:hidden;}

.card-top-progress{height:4px;background:var(--line-light);display:flex;flex:0 0 4px;}
.card-top-progress .fill{height:100%;background:var(--teal);transition:width .25s;}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 26px 8px;flex:0 0 auto;}
.card-header .brandlogo{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:700;font-size:13px;}
.brandlogo .mark{width:28px;height:28px;border-radius:50%;border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;color:var(--blue-mid);font-size:13px;}
.card-body{padding:6px 34px 20px;flex:1;overflow:auto;}
.card-body h2{color:var(--navy);font-size:19px;margin:0 0 4px;}
.kicker-badge{display:inline-block;color:var(--blue-mid);font-size:11.5px;font-weight:800;letter-spacing:.08em;margin-bottom:6px;}
.title-underline{height:2px;background:linear-gradient(90deg,var(--teal) 0 35%, #333 35% 100%);width:100%;margin-bottom:20px;}

.card-footer{border-top:1px solid var(--line-light);background:#fafbfc;padding:10px 26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#667;flex:0 0 auto;}
.footer-links{display:flex;gap:18px;}
.footer-links span{cursor:default;display:flex;align-items:center;gap:5px;}
.nav-arrows{display:flex;align-items:center;gap:14px;}
.nav-arrows button{border:none;background:#eee;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--navy);}
.nav-arrows button:disabled{opacity:.35;cursor:default;}
.page-indicator{font-weight:700;color:var(--navy);white-space:nowrap;}

/* ---------- HERO / LAUNCH SCREEN ---------- */
.hero{position:relative;flex:1;border-radius:4px;overflow:hidden;min-height:420px;background:#173a5e;}
.hero-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.hero::after{content:'';position:absolute;inset:0;z-index:1;background:
      linear-gradient(100deg, rgba(15,35,55,.88) 0%, rgba(15,35,55,.55) 42%, rgba(15,35,55,.15) 68%);}
.hero-content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;color:#fff;}
.hero-content h1{font-size:28px;margin:0 0 8px;max-width:560px;}
.hero-content p{max-width:480px;font-size:14px;opacity:.9;margin:0 0 22px;}
.launch-btn{align-self:flex-start;background:var(--navy-deep);color:#fff;border:none;padding:14px 34px;font-size:14px;
            font-weight:700;letter-spacing:.05em;cursor:pointer;clip-path:polygon(6% 0,100% 0,94% 100%,0% 100%);}
.launch-btn:hover{background:var(--navy);}

/* ---------- CHAPTER DIVIDER ---------- */
.divider-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
                background:linear-gradient(120deg,var(--navy-deep),var(--navy) 55%,var(--blue-mid));color:#fff;border-radius:4px;padding:40px;}
.divider-kicker{font-size:13px;letter-spacing:.15em;opacity:.8;margin-bottom:10px;font-weight:700;}
.divider-title{font-size:30px;font-weight:800;max-width:600px;}

/* ---------- CONTENT PAGE (bab isi) ---------- */
.content-layout{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;}
.content-text{flex:1;min-width:280px;}
.content-text .body-block p{font-size:14px;line-height:1.65;color:#334;margin:0 0 10px;}
.content-text .body-block ul{margin:0 0 10px;padding-left:20px;}
.content-text .body-block li{font-size:14px;line-height:1.6;color:#334;margin-bottom:4px;}
.content-image{flex:0 0 340px;max-width:340px;}
.content-image img{width:100%;border-radius:6px;box-shadow:0 0 0 1px #ddd;display:block;}
.content-image .cap{font-size:11.5px;color:#889;margin-top:6px;font-style:italic;}
.content-layout.stacked{flex-direction:column;}
.content-layout.stacked .content-image{flex:0 0 auto;width:100%;max-width:480px;margin-top:6px;}

/* ---------- HOTSPOT EXPLORE IMAGE ---------- */
.hotspot-layout{display:flex;flex-direction:column;gap:16px;margin-top:4px;}
.hotspot-stage{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #ddd;width:100%;max-width:700px;background:#fff;}
.hotspot-stage img{display:block;width:100%;height:auto;}
.hotspot-mask{position:absolute;background:#fff;pointer-events:none;}
.hotspot-pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:var(--blue-mid);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 0 0 3px rgba(45,119,194,.32);border:2px solid #fff;transition:.15s;}
.hotspot-pin.visited{background:var(--good);box-shadow:0 0 0 3px rgba(44,122,75,.28);}
.hotspot-pin.active{transform:scale(1.25);}
.hotspot-detail{background:#f5f7f9;border:1px solid var(--line-light);border-radius:6px;padding:14px 16px;min-height:58px;max-width:700px;}
.hotspot-detail-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.hotspot-detail-head h3{margin:0;font-size:14.5px;color:var(--navy);}
.mini-speak-btn{background:var(--navy);color:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;}
.mini-speak-btn:hover{background:var(--blue-mid);}
.hotspot-detail p{margin:0;font-size:13.5px;color:#334;line-height:1.6;}
.hotspot-detail .placeholder{color:#889;font-style:italic;}
.hotspot-progress{font-size:12px;color:#667;font-weight:700;}

/* ---------- DRAG-AND-DROP MATCHING ---------- */
.match-layout{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin-top:4px;}
.match-col{flex:1;min-width:240px;display:flex;flex-direction:column;gap:10px;}
.match-chip{background:#e9edf1;border:2px solid transparent;border-radius:6px;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:grab;user-select:none;transition:.15s;}
.match-chip.selected{border-color:var(--blue-mid);background:#dce9f7;}
.match-chip.matched{opacity:.32;cursor:default;pointer-events:none;}
.match-chip:active{cursor:grabbing;}
.match-zone{background:#f5f7f9;border:2px dashed #c7cfd6;border-radius:6px;padding:10px 14px;font-size:13px;color:#445;min-height:52px;display:flex;align-items:center;cursor:pointer;transition:.15s;}
.match-zone.over{border-color:var(--blue-mid);background:#eaf1fa;}
.match-zone.matched{border-style:solid;border-color:var(--good);background:#eaf6ee;color:#204;cursor:default;font-weight:600;}
.match-zone.wrong{border-color:var(--bad);background:#fbeceb;animation:matchShake .35s;}
@keyframes matchShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.match-progress{margin-top:18px;font-size:13px;font-weight:700;color:var(--navy);}

.speak-row{display:flex;align-items:center;gap:12px;margin:10px 0 16px;}
.speak-btn{background:var(--navy);color:#fff;border:none;padding:9px 18px;border-radius:4px;font-weight:700;cursor:pointer;font-size:13px;}
.speak-btn:disabled{opacity:.5;}

/* ---------- PPT-FIDELITY CLICK-BUILD ANIMATION ---------- */
.anim-stack{display:flex;flex-direction:column;gap:14px;max-width:820px;}
.anim-step img{max-width:100%;border-radius:6px;box-shadow:0 0 0 1px #ddd;display:block;}
.anim-step p{font-size:14px;line-height:1.6;color:#334;margin:0;background:#f5f7f9;border:1px solid var(--line-light);border-radius:6px;padding:12px 14px;}
.anim-step.anim-in{animation:animBuildIn .5s ease;}
@keyframes animBuildIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.anim-video{max-width:100%;border-radius:6px;box-shadow:0 0 0 1px #ddd;background:#000;}
.anim-hint{margin-top:14px;font-size:12.5px;color:#778;font-style:italic;}
.anim-step.icon-row{display:flex;align-items:center;gap:16px;background:#f5f7f9;border:1px solid var(--line-light);border-radius:6px;padding:12px 16px;}
.anim-step.icon-row img{width:56px;height:56px;object-fit:contain;flex:0 0 56px;border-radius:0;box-shadow:none;}
.anim-step.icon-row h3{margin:0 0 4px;font-size:14.5px;color:var(--navy);}
.anim-step.icon-row p{margin:0;background:none;border:none;padding:0;font-size:13.5px;}

/* ---------- FEATURE / STAT CARD GRIDS ---------- */
.cards-grid{display:grid;gap:16px;margin:14px 0 6px;}
.cards-grid.cols-2{grid-template-columns:repeat(2,1fr);}
.cards-grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:760px){.cards-grid.cols-2,.cards-grid.cols-3{grid-template-columns:1fr;}}
.feature-card{background:#e9edf1;border-radius:6px;padding:16px 18px;box-shadow:0 1px 4px rgba(20,40,60,.06);}
.feature-card:nth-child(even){background:#efeade;}
.feature-card h3{margin:0 0 6px;font-size:15px;color:var(--navy);}
.feature-card p{margin:0;font-size:13px;color:#445;line-height:1.5;}
.feature-card.stat{display:flex;flex-direction:column;justify-content:center;min-height:104px;}
.feature-card.stat .big{font-size:21px;font-weight:800;color:var(--navy);margin-bottom:6px;line-height:1.2;}
.feature-card.stat.dark{background:var(--navy-deep);}
.feature-card.stat.dark .big{color:#fff;}
.feature-card.stat.dark p{color:#dce4ee;}
.cards-trailing{margin-top:20px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
.cards-trailing img{max-width:320px;width:100%;border-radius:6px;box-shadow:0 0 0 1px #ddd;display:block;}
.cards-trailing .cap{font-size:11.5px;color:#889;font-style:italic;margin-top:6px;max-width:320px;}
.cards-note{flex:1;min-width:240px;font-size:13.5px;color:#334;line-height:1.6;background:#f5f7f9;border:1px solid var(--line-light);border-radius:6px;padding:12px 14px;}

/* ---------- QUESTION / OPTION LIST (fundus + quiz) ---------- */
.opt-list{display:flex;flex-direction:column;gap:0;margin-top:6px;max-width:680px;}
.opt-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line-light);cursor:pointer;font-size:14px;}
.opt-row input{width:16px;height:16px;accent-color:var(--blue-mid);flex:0 0 16px;}
.opt-row .letter{font-weight:700;color:var(--navy);width:18px;flex:0 0 18px;}
.opt-row.correct{color:var(--good);font-weight:700;}
.opt-row.wrong{color:var(--bad);font-weight:700;}
.opt-row.disabled{cursor:default;}
.reasoning-box{margin-top:16px;background:#eaf6ee;border:1px solid #cfe8d8;padding:12px 14px;border-radius:5px;font-size:13px;color:#204;max-width:680px;}
.submit-btn{margin-top:20px;background:#fff;border:1px solid #ccc;color:var(--navy);font-weight:700;
            padding:9px 26px;border-radius:3px;cursor:pointer;}
.submit-btn:disabled{opacity:.4;cursor:default;}
.quiz-tag{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;margin-bottom:12px;letter-spacing:.04em;}
.quiz-question{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 16px;max-width:700px;line-height:1.5;}

.fundus-layout{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;}
.fundus-stage{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #ddd;flex:0 0 auto;}
.fundus-stage img{display:block;width:340px;height:auto;}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
     background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
     cursor:pointer;box-shadow:0 0 0 4px rgba(192,57,43,.3);animation:pulse 1.6s infinite;}
.pin.revealed{background:var(--good);box-shadow:0 0 0 4px rgba(44,122,75,.28);animation:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.5);}70%{box-shadow:0 0 0 12px rgba(192,57,43,0);}100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}}
.pin-label{position:absolute;background:var(--navy);color:#fff;font-size:11px;padding:4px 9px;border-radius:4px;white-space:nowrap;
           transform:translate(-50%,-140%);pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.fundus-side{flex:1;min-width:260px;}
.fundus-progress{font-size:12px;color:#667;margin-top:10px;}
.level-tag{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;margin-bottom:12px;letter-spacing:.04em;}

/* ---------- DONE / CONGRATS SCREEN ---------- */
.done-screen{flex:1;background:linear-gradient(120deg,var(--navy-deep),var(--navy) 60%, var(--blue-mid));
             border-radius:4px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;}
.done-screen h1{font-size:34px;margin:0 0 10px;letter-spacing:.03em;}
.done-screen p{opacity:.9;max-width:460px;margin:0 0 6px;font-size:14px;}
.done-screen .score{font-size:20px;font-weight:700;margin:14px 0;}
.restart-btn{margin-top:24px;background:#fff;color:var(--navy);border:none;padding:11px 28px;border-radius:4px;font-weight:700;cursor:pointer;}

.note-banner{background:#fff8e1;border:1px solid #e0d08a;padding:9px 14px;border-radius:6px;font-size:12px;margin:0 0 14px;color:#5a4b12;}

/* ---------- CERTIFICATE ---------- */
.cert-form{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
.cert-form input{padding:10px 14px;border-radius:4px;border:none;font-size:14px;min-width:260px;}
.cert-form button{background:#fff;color:var(--navy);border:none;padding:10px 22px;border-radius:4px;font-weight:700;cursor:pointer;}
.cert-form button:hover{background:#eee;}
.certificate-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;background:var(--page-bg);}
.certificate{background:#fff;width:100%;max-width:820px;border:10px solid var(--navy-deep);padding:50px 60px;text-align:center;position:relative;box-shadow:0 4px 24px rgba(0,0,0,.15);}
.certificate::before{content:'';position:absolute;inset:12px;border:2px solid var(--teal);pointer-events:none;}
.cert-eyebrow{font-size:13px;letter-spacing:.2em;color:var(--blue-mid);font-weight:700;margin-bottom:8px;}
.certificate h1{font-size:30px;color:var(--navy);margin:0 0 26px;letter-spacing:.03em;}
.cert-given{font-size:13px;color:#667;margin-bottom:10px;}
.cert-name{font-size:32px;font-weight:800;color:var(--navy-deep);margin:0 0 20px;font-family:Georgia,'Times New Roman',serif;border-bottom:2px solid var(--line-light);display:inline-block;padding-bottom:12px;min-width:60%;}
.cert-desc{font-size:14px;color:#334;max-width:580px;margin:0 auto 26px;line-height:1.7;}
.cert-meta{display:flex;justify-content:center;gap:60px;margin-top:36px;font-size:12.5px;color:#667;}
.cert-meta b{color:var(--navy);display:block;font-size:15px;margin-bottom:3px;}
.cert-actions{margin-top:26px;display:flex;gap:12px;}
.cert-actions button{padding:11px 26px;border-radius:4px;font-weight:700;cursor:pointer;border:none;font-size:13.5px;}
.cert-print-btn{background:var(--navy);color:#fff;}
.cert-print-btn:hover{background:var(--navy-deep);}
.cert-back-btn{background:#e6e9ec;color:var(--navy);}
.cert-back-btn:hover{background:#dadfe3;}

@media print{
  .sidebar,.card-header,.card-footer,.card-top-progress,.cert-actions{display:none !important;}
  body,.app,.main{background:#fff !important;padding:0 !important;margin:0 !important;}
  .content-card{box-shadow:none !important;height:auto !important;}
  .certificate-wrap{padding:0 !important;}
  .certificate{box-shadow:none !important;}
}
</style>
</head>

<div class="app">

  <div class="sidebar">
    <div class="sidebar-head">
      <div class="top-icons"><span>&laquo; Semua Modul</span><span>&times;</span></div>

    <ul class="steps" id="stepList"></ul>
  </div>

  <div class="main">
    <div class="content-card" id="contentCard"></div>
  </div>

<script id="course-data" type="application/json">{"modules": [{"key": "pengantar", "label": "Pengantar", "pages": [{"type": "hero", "title": "Pelatihan Skrining Retinopati Diabetika", "body": "Modul 1 — Pengenalan Diabetes dan Retinopati Diabetika: definisi, epidemiologi, dan beban penyakit — dilengkapi narasi otomatis dan simulasi grading fundus interaktif untuk dokter layanan primer."}, {"type": "content", "kicker": "DAFTAR ISI", "title": "Cakupan modul", "body": "1. Diabetes Mellitus\n2. Retinopati Diabetika (RD)\n3. Skrining dan Tatalaksana Retinopati Diabetika", "transcript": "Cakupan modul. Setelah menyelesaikan modul ini, Anda akan memahami terkait diabetes mellitus, retinopati diabetika, dan skrining serta tata laksana retinopati diabetika secara umum.", "slide": 2}]}, {"key": "modul1", "label": "Modul 1 — Diabetes Mellitus", "pages": [{"type": "divider", "kicker": "BAB 1", "title": "DIABETES MELLITUS", "slide": 3}, {"type": "content", "kicker": "DEFINISI", "title": "Apa itu Diabetes Mellitus?", "slide": 4, "body": "Diabetes mellitus (DM) merupakan sekelompok penyakit metabolik dengan karakteristik hiperglikemia, yang menandakan abnormalitas proses metabolisme karbohidrat.\nKondisi ini diakibatkan oleh gangguan pada sekresi insulin, kerja insulin, ataupun keduanya.\n•  Hiperglikemia kronis adalah penanda utama — sekaligus pemicu komplikasi mikro- dan makrovaskular.", "transcript": "Diabetes mellitus merupakan sekelompok penyakit metabolik dengan karakteristik hiperglikemia kronik, yang menandakan abnormalitas proses metabolisme karbohidrat dalam tubuh. Kondisi ini diakibatkan oleh gangguan pada sekresi insulin, kerja insulin, ataupun keduanya. Kondisi hiperglikemia kronis adalah penanda utama, sekaligus pemicu terjadinya komplikasi mikro dan makrovaskular.", "image": "assets/slide4_10.png", "imageLayout": "below", "imageCaption": "The Egregious Eleven (diadaptasi dari Schwartz, Diabetes Care 2016)."}, {"type": "cards", "kicker": "EPIDEMIOLOGI", "title": "Prevalensi & proyeksi kasus DM", "slide": 5, "intro": "Beban diabetes global terus meningkat — dan Indonesia termasuk negara dengan kasus terbanyak.", "transcript": "Beban diabetes secara global terus meningkat dan telah mencapai jumlah yang mengkhawatirkan. Sekitar 589 juta penduduk dunia dilaporkan memiliki diabetes dan angka ini diproyeksikan akan meningkat sebanyak 45% di tahun 2050. Indonesia menduduki peringkat ke-5 dengan jumlah penderita diabetes terbanyak di dunia, yaitu mencapai 20,4 juta penderita atau sebesar 11,3%.", "columns": 3, "cards": [{"big": "588,7 juta", "body": "penderita DM di dunia (2024)"}, {"big": "852,5 juta (↑ 45%)", "body": "proyeksi kasus dunia pada 2050"}, {"big": "Peringkat 5", "body": "negara dengan penderita DM terbanyak", "dark": true}, {"big": "20,4 juta", "body": "penderita DM di Indonesia (2024)"}, {"big": "11,3%", "body": "penduduk Indonesia usia 20–79 tahun"}]}, {"type": "content", "kicker": "KLASIFIKASI", "title": "DM berdasarkan etiologi", "slide": 6, "body": "•  Tipe 1 — pankreas berhenti memproduksi insulin.\n•  Tipe 2 — resistensi insulin pada organ, dan/atau produksi insulin pankreas tidak mencukupi.\n•  Gestasional — terdiagnosis pada trimester kedua/ketiga kehamilan, tanpa riwayat diabetes sebelumnya.\n•  Tipe lain — mis. MODY (mutasi genetik tunggal), penyakit eksokrin pankreas, akibat obat/zat kimia, infeksi, sebab imunologi, atau genetik lain.", "transcript": "Berdasarkan etiologinya, diabetes mellitus diklasifikasikan menjadi empat. Diabetes mellitus tipe 1, sebuah kondisi dimana terjadi peningkatan kadar glukosa dalam darah dikarenakan pankreas berhenti memproduksi insulin. Diabetes mellitus tipe 2, disebabkan oleh resistensi insulin pada organ ataupun pankreas yang tidak memproduksi cukup insulin. Diabetes mellitus gestasional, merupakan diabetes yang terdiagnosis pada trimester kedua atau ketiga kehamilan, dimana sebelum kehamilan tidak didapatkan diabetes. Dan tipe spesifik akibat penyebab lain, di antaranya Maturity-Onset Diabetes of the Young yang disebabkan mutasi genetik tunggal, atau penyebab lain seperti penyakit eksokrin pankreas, akibat obat atau zat kimia, infeksi, sebab imunologi, atau sebab genetik lain.", "image": "assets/slide6_8.png", "imageLayout": "below"}, {"type": "content", "kicker": "FAKTOR RISIKO", "title": "Faktor risiko Diabetes Mellitus", "slide": 7, "body": "IMT > 23 kg/m² disertai ≥ 1 faktor risiko berikut:", "transcript": "Berdasarkan PERKENI 2021, beberapa faktor risiko yang terbukti meningkatkan kejadian diabetes mellitus, terutama tipe 2, adalah indeks massa tubuh di atas 23 kg per meter persegi yang disertai dengan minimal satu faktor risiko berikut: aktivitas fisik yang kurang, memiliki riwayat keluarga diabetes, berasal dari ras atau etnis tertentu, memiliki riwayat melahirkan bayi dengan berat lebih dari 4 kilogram atau terdiagnosis diabetes gestasional, memiliki hipertensi, HDL kurang dari 35 dan atau trigliserida lebih dari 250, wanita dengan sindrom polikistik ovarium, memiliki riwayat prediabetes, obesitas berat dengan akantosis nigrikans, dan memiliki riwayat penyakit kardiovaskular.", "reveal_steps": [{"texts": ["a. Aktivitas fisik kurang"]}, {"texts": ["b. Riwayat keluarga (keturunan) DM"]}, {"texts": ["c. Ras/etnis tertentu"]}, {"texts": ["d. Riwayat bayi lahir > 4 kg / DM gestasional"]}, {"texts": ["e. Hipertensi (≥ 140/90 mmHg)"]}, {"texts": ["f. HDL < 35 atau trigliserida > 250 mg/dL"]}, {"texts": ["g. Sindrom ovarium polikistik (PCOS)"]}, {"texts": ["h. Riwayat prediabetes"]}, {"texts": ["i. Obesitas berat + akantosis nigrikans"]}, {"texts": ["j. Riwayat penyakit kardiovaskular"]}]}, {"type": "content", "kicker": "DIAGNOSIS", "title": "Kriteria diagnosis DM", "slide": 8, "body": "Empat kriteria diagnosis diabetes mellitus menurut PERKENI 2021 (lihat ringkasan pada gambar).", "transcript": "Kriteria diagnosis DM: gula darah puasa lebih dari sama dengan 126 mg per dL; TTGO 2 jam lebih dari sama dengan 200 mg per dL; gula darah sewaktu lebih dari sama dengan 200 mg per dL disertai keluhan klasik atau krisis hiperglikemia; atau HbA1c lebih dari sama dengan 6,5 persen.", "image": "assets/slide8_8.png", "imageLayout": "below"}, {"type": "content", "kicker": "DIAGNOSIS", "title": "Klasifikasi kadar glukosa & HbA1c", "slide": 9, "body": "Klasifikasi kadar glukosa darah dan HbA1c untuk kategori diabetes, prediabetes, dan normal (lihat gambar).", "transcript": "Berikut klasifikasi kadar glukosa dan HbA1c untuk kategori diabetes, prediabetes, dan normal. Perlu diperhatikan pula kondisi-kondisi yang membuat hasil HbA1c menjadi tidak valid, seperti anemia, hemoglobinopati, transfusi, dan gangguan ginjal.", "image": "assets/slide9_8.png", "imageLayout": "below"}, {"type": "content", "kicker": "KOMPLIKASI", "title": "Komplikasi diabetes mellitus", "slide": 10, "body": "Hiperglikemia kronis memicu makroangiopati (jantung, otak, pembuluh darah perifer) dan mikroangiopati (retinopati, neuropati, nefropati).", "transcript": "Diabetes mellitus yang menyebabkan hiperglikemia dapat memicu makroangiopati dan mikroangiopati, termasuk di antaranya retinopati, neuropati, dan nefropati.", "image": "assets/slide10_8.png", "imageLayout": "below"}]}, {"key": "modul2", "label": "Modul 2 — Retinopati Diabetika", "pages": [{"type": "divider", "kicker": "BAB 2", "title": "RETINOPATI DIABETIKA", "slide": 11}, {"type": "hotspot", "kicker": "ANATOMI", "title": "Anatomi mata", "slide": 12, "intro": "Klik tiap titik untuk melihat penjelasan singkat bagian mata tersebut — dasar untuk memahami lokasi kerusakan pada retinopati diabetika.", "image": "assets/slide12_8.png", "points": [{"x": 21.38, "y": 17.12, "label": "Kornea", "body": "Lapisan bening tembus cahaya di bagian depan mata; membiaskan sebagian besar cahaya yang masuk sebelum melewati lensa."}, {"x": 22.88, "y": 22.67, "label": "Iris", "body": "Selaput berwarna yang mengatur ukuran pupil, sehingga mengontrol jumlah cahaya yang masuk ke dalam mata."}, {"x": 87.75, "y": 20.09, "label": "Bilik mata anterior", "body": "Rongga berisi aqueous humor antara kornea dan iris."}, {"x": 88.2, "y": 24.72, "label": "Bilik mata posterior", "body": "Rongga kecil berisi aqueous humor antara iris dan lensa, tempat cairan ini diproduksi sebelum mengalir ke bilik anterior."}, {"x": 83.5, "y": 29.38, "label": "Lensa", "body": "Struktur bening di belakang iris yang memfokuskan cahaya ke retina; bentuknya berubah saat berakomodasi (fokus dekat-jauh)."}, {"x": 19.2, "y": 27.96, "label": "Badan siliaris", "body": "Struktur otot yang menghasilkan aqueous humor dan mengatur bentuk lensa saat berakomodasi."}, {"x": 19.85, "y": 33.47, "label": "Ora serrata", "body": "Batas tepi retina di bagian perifer, tempat retina menyatu dengan badan siliaris."}, {"x": 17.23, "y": 48.36, "label": "Otot rektus medial", "body": "Salah satu otot ekstraokular yang menggerakkan bola mata ke arah dalam (nasal)."}, {"x": 87.83, "y": 48.89, "label": "Otot rektus lateral", "body": "Otot ekstraokular yang menggerakkan bola mata ke arah luar (temporal)."}, {"x": 44.0, "y": 48.4, "label": "Badan vitreus", "body": "Gel bening yang mengisi rongga antara lensa dan retina, menjaga bentuk bola mata."}, {"x": 83.6, "y": 60.49, "label": "Sklera", "body": "Lapisan luar mata yang keras dan berwarna putih; berfungsi sebagai pelindung struktural bola mata."}, {"x": 83.65, "y": 65.16, "label": "Koroid", "body": "Lapisan pembuluh darah di antara sklera dan retina yang memberi nutrisi ke retina bagian luar."}, {"x": 83.63, "y": 70.0, "label": "Retina", "body": "Lapisan saraf peka cahaya di bagian dalam mata — di sinilah kerusakan pembuluh darah akibat diabetes (retinopati diabetika) terjadi."}, {"x": 54.28, "y": 94.56, "label": "Fovea", "body": "Titik di tengah makula dengan ketajaman penglihatan tertinggi; edema pada area ini (edema makula) sangat memengaruhi tajam penglihatan."}, {"x": 18.48, "y": 81.38, "label": "Selubung dural", "body": "Lapisan pelindung yang membungkus saraf optik, bersambungan dengan meningen otak."}, {"x": 12.85, "y": 87.38, "label": "Arteri & vena retina sentralis", "body": "Pembuluh darah utama yang memperdarahi dan mengalirkan darah dari retina, masuk melalui saraf optik."}, {"x": 19.98, "y": 93.38, "label": "Saraf optik", "body": "Berkas serat saraf yang menghantarkan sinyal visual dari retina ke otak."}], "masks": [{"x": 18.15, "y": 14.67, "w": 6.45, "h": 4.89}, {"x": 21.1, "y": 20.18, "w": 3.55, "h": 4.98}, {"x": 13.75, "y": 25.51, "w": 10.9, "h": 4.89}, {"x": 15.05, "y": 31.02, "w": 9.6, "h": 4.89}, {"x": 9.85, "y": 45.87, "w": 14.75, "h": 4.98}, {"x": 12.35, "y": 78.67, "w": 12.25, "h": 5.42}, {"x": 1.05, "y": 84.89, "w": 23.6, "h": 4.98}, {"x": 15.35, "y": 90.67, "w": 9.25, "h": 5.42}, {"x": 80.65, "y": 17.6, "w": 14.2, "h": 4.98}, {"x": 80.65, "y": 21.96, "w": 15.1, "h": 5.51}, {"x": 80.65, "y": 26.93, "w": 5.7, "h": 4.89}, {"x": 80.6, "y": 46.4, "w": 14.45, "h": 4.98}, {"x": 80.65, "y": 58.04, "w": 5.9, "h": 4.89}, {"x": 80.65, "y": 62.67, "w": 6.0, "h": 4.98}, {"x": 80.65, "y": 67.64, "w": 5.95, "h": 4.71}, {"x": 44.75, "y": 3.38, "w": 14.25, "h": 7.91}, {"x": 38.5, "y": 45.51, "w": 11.25, "h": 7.82}, {"x": 51.9, "y": 92.6, "w": 4.75, "h": 3.91}]}, {"type": "cards", "kicker": "RETINOPATI DIABETIKA", "title": "Apa itu retinopati diabetika?", "slide": 13, "transcript": "Retinopati diabetika adalah kerusakan kapiler retina kronik akibat hiperglikemia, yang menyebabkan kebocoran cairan, oklusi, hingga neovaskularisasi. Kejadiannya meningkat cepat, namun dapat dicegah. Spektrum keparahannya menurut ICDRS bergerak dari tanpa retinopati diabetika, ke non-proliferative RD ringan, sedang, berat, hingga proliferative RD.", "columns": 3, "cards": [{"title": "Kerusakan kapiler retina", "body": "Akibat gula darah tinggi yang kronis."}, {"title": "Kebocoran & penyumbatan", "body": "Kebocoran cairan, edema, oklusi, neovaskularisasi."}, {"title": "Dapat dicegah", "body": "Kejadian meningkat cepat, namun dapat dicegah."}], "trailingImage": "assets/slide13_15.png", "trailingCaption": "Spektrum keparahan retinopati diabetika (ICDRS)", "trailingNote": "Tanpa RD → Non-proliferative RD (NPDR) ringan → sedang → berat → Proliferative RD (PDR), seiring meningkatnya risiko kebutaan."}, {"type": "content", "kicker": "BEBAN PENYAKIT", "title": "Retinopati diabetika", "slide": 14, "body": "•  Sekitar 93 juta orang di dunia menderita retinopati diabetika.\n•  Sekitar sepertiga populasi diabetes global diperkirakan akan mengidap RD.\n•  Di Indonesia, prevalensi RD pada populasi usia 30+ tahun dengan DM Tipe 2 mencapai 43,1%.\n•  Insidensi tertinggi pada pasien dengan durasi DM > 10 tahun.", "transcript": "Beban penyakit retinopati diabetika: prevalensi retinopati diabetika di Indonesia mencapai 43,1 persen, dengan sight-threatening DR sebesar 26,1 persen, dan sekitar 93 juta penderita RD secara global.", "image": "assets/chart_beban_rd.png", "imageCaption": "Prevalensi blindness, VTDR, dan DR overall (%) — Global, Asia-Pacific high income, China, India, Indonesia."}, {"type": "hotspot", "kicker": "PATOFISIOLOGI", "title": "Patofisiologi retinopati diabetika", "slide": 15, "intro": "Klik tiap titik untuk menelusuri alur patofisiologi, dari hiperglikemia kronik hingga neovaskularisasi.", "image": "assets/slide15_8.png", "points": [{"x": 9.5, "y": 16.0, "label": "Hiperglikemia kronik", "body": "Kadar glukosa darah yang tinggi dalam jangka panjang adalah pemicu awal seluruh rangkaian kerusakan pada pembuluh darah retina."}, {"x": 38.0, "y": 13.0, "label": "Kerusakan dinding kapiler", "body": "Hiperglikemia kronik merusak perisit, menebalkan membran basal, dan merusak taut antar sel endotel kapiler retina, membuat dinding pembuluh darah rapuh dan bocor."}, {"x": 28.0, "y": 32.85, "label": "Kebocoran kapiler", "body": "Cairan plasma merembes keluar dari kapiler yang rusak (ekstravasasi plasma), menyebabkan penumpukan cairan di jaringan retina."}, {"x": 47.87, "y": 32.85, "label": "Oklusi kapiler", "body": "Sel darah putih menumpuk dan menyumbat kapiler retina (leukostasis), mengurangi aliran darah ke jaringan sekitarnya."}, {"x": 28.75, "y": 71.53, "label": "Edema makula", "body": "Cairan yang bocor terkumpul di makula (pusat penglihatan tajam), menyebabkan penglihatan kabur atau distorsi — komplikasi RD yang paling sering mengganggu penglihatan."}, {"x": 63.19, "y": 41.53, "label": "Iskemia retina", "body": "Penyumbatan kapiler yang meluas membuat sebagian jaringan retina kekurangan oksigen dan nutrisi."}, {"x": 73.89, "y": 40.62, "label": "Peningkatan VEGF", "body": "Jaringan retina yang iskemik melepaskan vascular endothelial growth factor (VEGF) untuk memicu pertumbuhan pembuluh darah baru."}, {"x": 90.0, "y": 40.08, "label": "Neovaskularisasi (PDR)", "body": "Pembuluh darah baru yang rapuh tumbuh abnormal di permukaan retina — stadium paling berat RD, berisiko perdarahan vitreus, ablasio retina traksional, dan glaukoma neovaskular."}], "masks": [{"x": 24.18, "y": 31.4, "w": 7.66, "h": 2.89}, {"x": 43.08, "y": 31.4, "w": 9.57, "h": 2.89}, {"x": 22.64, "y": 70.08, "w": 12.21, "h": 2.89}, {"x": 59.93, "y": 38.26, "w": 6.51, "h": 6.53}, {"x": 71.0, "y": 39.17, "w": 5.79, "h": 2.89}, {"x": 81.76, "y": 38.02, "w": 16.47, "h": 4.13}]}, {"type": "cards", "kicker": "TANDA & GEJALA", "title": "Gejala klinis retinopati diabetika", "slide": 16, "transcript": "Tanda dan gejala retinopati diabetika meliputi penglihatan buram, bintik hitam atau floaters, kehilangan penglihatan mendadak yang khas pada perdarahan vitreus, dan distorsi penglihatan yang khas pada edema makula.", "columns": 2, "cards": [{"title": "Penglihatan kabur", "body": "Keluhan paling umum, sering bertahap."}, {"title": "Bintik hitam / floaters", "body": "Bayangan mengambang pada lapang pandang."}, {"title": "Kehilangan penglihatan mendadak", "body": "Khas pada perdarahan vitreus."}, {"title": "Distorsi penglihatan", "body": "Garis tampak bengkok — khas edema makula."}]}, {"type": "content", "kicker": "FAKTOR RISIKO", "titl <script>
/* ---------- SCORM 1.2 API glue (no-op harmlessly if not launched from an LMS) ---------- */
var scormAPIHandle = null;
function scormFindAPI(win){
  var attempts = 0;
  while (win.API == null && win.parent != null && win.parent != win){
    attempts++;
    if (attempts > 10) return null;
    win = win.parent;
  }
  return win.API || null;
}
function scormGetAPI(){
  if (scormAPIHandle) return scormAPIHandle;
  var api = scormFindAPI(window);
  if (!api && window.opener) api = scormFindAPI(window.opener);
  scormAPIHandle = api;
  return scormAPIHandle;
}
function scormInit(){
  var api = scormGetAPI();
  if (!api) return;
  try {
    api.LMSInitialize('');
    if (api.LMSGetValue('cmi.core.lesson_status') === 'not attempted'){
      api.LMSSetValue('cmi.core.lesson_status', 'incomplete');
      api.LMSCommit('');
    }
  } catch(e){}
}
function scormSetValue(name, value){
  var api = scormGetAPI();
  if (!api) return;
  try { api.LMSSetValue(name, String(value)); api.LMSCommit(''); } catch(e){}
}
function scormFinish(){
  var api = scormGetAPI();
  if (!api) return;
  try { api.LMSFinish(''); } catch(e){}
}
window.addEventListener('beforeunload', scormFinish);

const COURSE = JSON.parse(document.getElementById('course-data').textContent).modules;

const TOTAL_PAGES = COURSE.reduce((s,m)=>s+Math.max(m.pages.length,1),0);

const state = {
  modIdx: 0,
  pageIdx: 0,
  furthestModIdx: 0,
  fundusAnswered: {},
  fundusPins: {},
  revealCounts: {},
  quizAnswers: {},
  hotspotVisited: {},
  hotspotActive: {},
  matchState: {},
  learnerName: '',
  showCertificate: false,
};

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function stopSpeech(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function speakText(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'id-ID';
  window.speechSynthesis.speak(u);
}

function pageKey(){ return state.modIdx + '-' + state.pageIdx; }
function getRevealCount(key){
  if(!(key in state.revealCounts)) state.revealCounts[key] = 1;
  return state.revealCounts[key];
}
function fundusKey(){ return pageKey(); }
function getFundusAnswered(){ return !!state.fundusAnswered[fundusKey()]; }
function getFundusPins(page){
  const k = fundusKey();
  if(!state.fundusPins[k]) state.fundusPins[k] = page.lesions.map(()=>false);
  return state.fundusPins[k];
}

function renderSidebar(){
  const ul = document.getElementById('stepList');
  ul.innerHTML = COURSE.map((m,i)=>{
    const locked = i > state.furthestModIdx;
    const done = i < state.furthestModIdx;
    let cls = 'step';
    if(i === state.modIdx) cls += ' active';
    else if(done) cls += ' done';
    else if(locked) cls += ' locked';
    const icon = done ? '\u2713' : (locked ? '\u{1F512}' : '\u25B6');
    return `<li class="${cls}" data-idx="${i}" title="${locked ? 'Selesaikan modul sebelumnya dulu' : ''}">
      <span class="num">${i+1}</span>
      <span class="play">${icon}</span>
      <span>${m.label}</span>
    </li>`;
  }).join('');
  ul.querySelectorAll('.step').forEach(el=>{
    const i = parseInt(el.dataset.idx,10);
    if(i > state.furthestModIdx) return;
    el.onclick = ()=>{ stopSpeech(); state.modIdx = i; state.pageIdx = 0; render(); };
  });
}

function globalPageNumber(){
  let n = 0;
  for(let i=0;i<state.modIdx;i++) n += Math.max(COURSE[i].pages.length,1);
  return n + state.pageIdx + 1;
}
function progressFillPct(){
  return Math.round((globalPageNumber()-1) / (TOTAL_PAGES-1) * 100);
}

function goPrev(){
  stopSpeech();
  if(state.pageIdx > 0){ state.pageIdx--; render(); return; }
  if(state.modIdx > 0){
    state.modIdx--;
    const prevPages = COURSE[state.modIdx].pages;
    state.pageIdx = Math.max(prevPages.length - 1, 0);
    render();
  }
}
function goNext(){
  const pages = COURSE[state.modIdx].pages;
  const page = pages[state.pageIdx];
  if(page && page.type === 'quiz' && !state.quizAnswers[pageKey()]){
    return;
  }
  if(page && page.reveal_steps && page.reveal_steps.length){
    const key = pageKey();
    const total = page.reveal_steps.length;
    const revealed = getRevealCount(key);
    if(revealed < total){
      stopSpeech();
      state.revealCounts[key] = revealed + 1;
      render();
      return;
    }
  }
  stopSpeech();
  if(state.pageIdx < pages.length - 1){ state.pageIdx++; render(); return; }
  if(state.modIdx < COURSE.length - 1){
    state.modIdx++;
    state.pageIdx = 0;
    state.furthestModIdx = Math.max(state.furthestModIdx, state.modIdx);
    render();
  }
}

function cardShell(innerBody, opts={}){
  const atFirst = state.modIdx === 0 && state.pageIdx === 0;
  const atLast = state.modIdx === COURSE.length - 1;
  return `
    <div class="card-top-progress"><div class="fill" style="width:${progressFillPct()}%"></div></div>
    <div class="card-header">
      <div></div>
      <div class="brandlogo"><div class="mark">👁</div> DRIVE School</div>
    </div>
    <div class="card-body">${innerBody}</div>
    <div class="card-footer">
      <div class="footer-links"><span>📄 Transkrip</span><span>\u2753 Bantuan</span><span>🔗 Referensi</span></div>
      <div class="nav-arrows">
        <button id="prevBtn" ${atFirst?'disabled':''}>&#8592;</button>
        <span class="page-indicator">${opts.pageLabel || (globalPageNumber()+' / '+TOTAL_PAGES)}</span>
        <button id="nextBtn" ${atLast?'disabled':''}>&#8594;</button>
      </div>
    </div>
  `;
}

function wireFooterNav(){
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(prevBtn) prevBtn.onclick = goPrev;
  if(nextBtn) nextBtn.onclick = goNext;
}

function kickerHtml(page){
  return page.kicker ? `<div class="kicker-badge">${esc(page.kicker)}</div>` : '';
}

function renderBodyBlock(body){
  if(!body) return '';
  let lines = body.split('\n').filter(l=>l.trim()).map(l=>l.trim());
  const merged = [];
  for(let i=0;i<lines.length;i++){
    if(/^\d{1,2}$/.test(lines[i]) && i+1 < lines.length && !/^\d{1,2}$/.test(lines[i+1])){
      merged.push(lines[i] + '. ' + lines[i+1]);
      i++;
    } else {
      merged.push(lines[i]);
    }
  }
  lines = merged;
  let html = '';
  let inList = false;
  lines.forEach(line=>{
    const isBullet = /^[\u2022\u00b7]\s*/.test(line) || /^[a-j]\.\s+/.test(line) || /^\d{1,2}\.\s+/.test(line);
    const text = line.replace(/^[\u2022\u00b7]\s*/, '');
    if(isBullet){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${esc(text)}</li>`;
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      html += `<p>${esc(line)}</p>`;
    }
  });
  if(inList) html += '</ul>';
  return html;
}

function renderPengantarHero(page){
  document.getElementById('contentCard').innerHTML = `
    <div class="hero">
      <img class="hero-bg-img" src="assets/hero-illustration.svg" alt="">
      <div class="hero-content">
        <h1>${esc(page.title)}</h1>
        <p>${esc(page.body)}</p>
        <button class="launch-btn" id="launchBtn">MULAI &#8594;</button>
      </div>
    </div>
  `;
  document.getElementById('launchBtn').onclick = goNext;
}

function renderDivider(page){
  document.getElementById('contentCard').innerHTML = `
    <div class="card-top-progress"><div class="fill" style="width:${progressFillPct()}%"></div></div>
    <div class="divider-screen">
      ${page.kicker ? `<div class="divider-kicker">${esc(page.kicker)}</div>` : ''}
      <div class="divider-title">${esc(page.title||'')}</div>
    </div>
    <div class="card-footer">
      <div class="footer-links"><span>📄 Transkrip</span><span>\u2753 Bantuan</span><span>🔗 Referensi</span></div>
      <div class="nav-arrows">
        <button id="prevBtn"></button>
        <span class="page-indicator">${globalPageNumber()} / ${TOTAL_PAGES}</span>
        <button id="nextBtn">&#8594;</button>
      </div>
    </div>
  `;
  wireFooterNav();
}

function wireSpeakButton(page){
  const speakBtn = document.getElementById('speakBtn');
  if(!speakBtn) return;
  speakBtn.onclick = (e)=>{
    if(!('speechSynthesis' in window)){ alert('Browser ini tidak mendukung Web Speech API.'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(page.transcript);
    u.lang = 'id-ID';
    e.target.disabled = true; e.target.textContent = '🔈 Membacakan...';
    u.onend = ()=>{ e.target.disabled=false; e.target.textContent='🔊 Dengarkan Narasi'; };
    u.onerror = ()=>{ e.target.disabled=false; e.target.textContent='🔊 Dengarkan Narasi'; };
    window.speechSynthesis.speak(u);
  };
}

function renderContentPage(page){
  if(page.reveal_steps && page.reveal_steps.length){
    renderAnimatedContentPage(page);
    return;
  }
  const body = `
    ${kickerHtml(page)}
    ${page.title ? `<h2>${esc(page.title)}</h2><div class="title-underline"></div>` : '<div style="height:14px"></div>'}
    <div class="content-layout${page.imageLayout==='below'?' stacked':''}">
      <div class="content-text">
        ${page.transcript ? `<div class="speak-row"><button class="speak-btn" id="speakBtn">🔊 Dengarkan Narasi</button></div>` : ''}
        <div class="body-block">${renderBodyBlock(page.body)}</div>
      </div>
      ${page.image ? `<div class="content-image"><img src="${page.image}" alt="Ilustrasi slide ${page.slide}">${page.imageCaption?`<div class="cap">${esc(page.imageCaption)}</div>`:''}</div>` : ''}
    </div>
  `;
  document.getElementById('contentCard').innerHTML = cardShell(body);
  wireFooterNav();
  wireSpeakButton(page);
}

function renderAnimatedContentPage(page){
  const key = pageKey();
  const total = page.reveal_steps.length;
  const revealed = getRevealCount(key);
  const stepsHtml = page.reveal_steps.slice(0, revealed).map((s, i)=>{
    const isNew = i === revealed - 1;
    const cls = 'anim-step' + (isNew ? ' anim-in' : '');
    if(s.video){
      return `<div class="${cls}"><video class="anim-video" controls poster="assets/visus_poster.jpg" src="assets/visus.mp4"></video></div>`;
    }
    if(s.image && (s.title || s.body)){
      return `<div class="${cls} icon-row"><img src="${s.image}" alt=""><div><h3>${esc(s.title||'')}</h3><p>${esc(s.body||'')}</p></div></div>`;
    }
    if(s.image){
      return `<div class="${cls}"><img src="${s.image}" alt="Bagian slide ${page.slide}"></div>`;
    }
    return `<div class="${cls}"><p>${esc((s.texts||[]).join(' '))}</p></div>`;
  }).join('');

  const notYetDone = revealed < total;

  const body = `
    ${kickerHtml(page)}
    ${page.title ? `<h2>${esc(page.title)}</h2><div class="title-underline"></div>` : '<div style="height:14px"></div>'}
    ${page.transcript ? `<div class="speak-row"><button class="speak-btn" id="speakBtn">🔊 Dengarkan Narasi</button></div>` : ''}
    ${page.body ? `<div class="body-block">${renderBodyBlock(page.body)}</div>` : ''}
    <div class="anim-stack">${stepsHtml}</div>
    <div class="anim-hint">${notYetDone ? `Klik &#8594; untuk melanjutkan (${revealed}/${total})` : `&#10003; Semua bagian slide ini sudah ditampilkan.`}</div>
  `;
  document.getElementById('contentCard').innerHTML = cardShell(body);
  wireFooterNav();
  wireSpeakButton(page);
}

function renderCardsPage(page){
  const cols = page.columns || (page.cards.length>=3?3:2);
  const cardsHtml = page.cards.map(c=>{
    if(c.big !== undefined){
      return `<div class="feature-card stat ${c.dark?'dark':''}"><div class="big">${esc(c.big)}</div><p>${esc(c.body)}</p></div>`;
    }
    return `<div class="feature-card"><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p></div>`;
  }).join('');
  const trailing = page.trailingImage ? `
    <div class="cards-trailing">
      <div><img src="${page.trailingImage}" alt="Ilustrasi slide ${page.slide}">${page.trailingCaption?`<div class="cap">${esc(page.trailingCaption)}</div>`:''}</div>
      ${page.trailingNote?`<div class="cards-note">${esc(page.trailingNote)}</div>`:''}
    </div>` : '';
  const body = `
    ${kickerHtml(page)}
    <h2>${esc(page.title)}</h2>
    <div class="title-underline"></div>
    ${page.intro?`<p style="font-size:14px;color:#334;margin:0 0 14px;line-height:1.6;">${esc(page.intro)}</p>`:''}
    ${page.transcript ? `<div class="speak-row"><button class="speak-btn" id="speakBtn">🔊 Dengarkan Narasi</button></div>` : ''}
    <div class="cards-grid cols-${cols}">${cardsHtml}</div>
    ${trailing}
  `;
  document.getElementById('contentCard').innerHTML = cardShell(body);
  wireFooterNav();
  wireSpeakButton(page);
}

function renderHotspotPage(page){
  const key = pageKey();
  if(!state.hotspotVisited[key]) state.hotspotVisited[key] = page.points.map(()=>false);
  const visited = state.hotspotVisited[key];
  const activeIdx = state.hotspotActive[key];

  const masksHtml = (page.masks||[]).map(m=>{
    return `<div class="hotspot-mask" style="left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%"></div>`;
  }).join('');

  const pinsHtml = page.points.map((p,i)=>{
    let cls = 'hotspot-pin';
    if(visited[i]) cls += ' visited';
    if(activeIdx === i) cls += ' active';
    return `<div class="${cls}" data-i="${i}" style="left:${p.x}%;top:${p.y}%">${i+1}</div>`;
  }).join('');

  const doneCount = visited.filter(Boolean).length;
  const total = page.points.length;

  let detailHtml;
  if(activeIdx !== undefined && activeIdx !== null){
    const p = page.points[activeIdx];
    detailHtml = `<div class="hotspot-detail-head"><h3>${esc(p.label)}</h3><button class="mini-speak-btn" id="hotspotSpeakBtn" title="Dengarkan lagi">🔊</button></div><p>${esc(p.body)}</p>`;
  } else {
    detailHtml = `<p class="placeholder">Klik salah satu titik pada gambar untuk melihat penjelasannya.</p>`;
  }

  const body = `
    ${kickerHtml(page)}
    <h2>${esc(page.title)}</h2>
    <div class="title-underline"></div>
    ${page.intro?`<p style="font-size:14px;color:#334;margin:0 0 14px;line-height:1.6;">${esc(page.intro)}</p>`:''}
    <div class="hotspot-layout">
      <div class="hotspot-stage" id="hotspotStage">
        <img src="${page.image}" alt="Ilustrasi slide ${page.slide}">
        ${masksHtml}
        ${pinsHtml}
      </div>
      <div class="hotspot-progress">Bagian dijelajahi: ${doneCount}/${total}</div>
      <div class="hotspot-detail" id="hotspotDetail">${detailHtml}</div>
    </div>
  `;
  document.getElementById('contentCard').innerHTML = cardShell(body);
  wireFooterNav();

  const speakBtn = document.getElementById('hotspotSpeakBtn');
  if(speakBtn){
    speakBtn.onclick = ()=>{
      const p = page.points[activeIdx];
      speakText(p.label + '. ' + p.body);
    };
  }

  document.querySelectorAll('#hotspotStage .hotspot-pin').forEach(pinEl=>{
    pinEl.onclick = ()=>{
      const i = parseInt(pinEl.dataset.i,10);
      visited[i] = true;
      state.hotspotActive[key] = i;
      speakText(page.points[i].label + '. ' + page.points[i].body);
      render();
    };
  });
}

function renderMatchPage(page){
  const key = pageKey();
  if(!state.matchState[key]){
    state.matchState[key] = {
      leftOrder: shuffleArray(page.pairs.map(p=>p.id)),
      rightOrder: shuffleArray(page.pairs.map(p=>p.id)),
      matched: {},
      selected: null,
    };
  }
  const ms = state.matchState[key];
  const byId = {};
  page.pairs.forEach(p=>{ byId[p.id] = p; });

  const leftHtml = ms.leftOrder.map(id=>{
    const p = byId[id];
    const isMatched = !!ms.matched[id];
    let cls = 'match-chip';
    if(isMatched) cls += ' matched';
    else if(ms.selected === id) cls += ' selected';
    return `<div class="${cls}" draggable="${!isMatched}" data-id="${id}">${esc(p.left)}</div>`;
  }).join('');

  const rightHtml = ms.rightOrder.map(id=>{
    const p = byId[id];
    const isMatched = !!ms.matched[id];
    let cls = 'match-zone';
    if(isMatched) cls += ' matched';
    return `<div class="${cls}" data-id="${id}">${esc(p.right)}</div>`;
  }).join('');

  const doneCount = Object.keys(ms.matched).length;
  const total = page.pairs.length;

  const body = `
    ${kickerHtml(page)}
    <h2>${esc(page.title)}</h2>
    <div class="title-underline"></div>
    ${page.intro?`<p style="font-size:14px;color:#334;margin:0 0 14px;line-height:1.6;">${esc(page.intro)}</p>`:''}
    <div class="match-layout">
      <div class="match-col" id="matchLeft">${leftHtml}</div>
      <div class="match-col" id="matchRight">${rightHtml}</div>
    </div>
    <div class="match-progress">${doneCount===total ? ('&#10003; Semua ('+total+'/'+total+') sudah cocok!') : ('Tercocokkan: '+doneCount+'/'+total)}</div>
  `;
  document.getElementById('contentCard').innerHTML = cardShell(body);
  wireFooterNav();

  function tryMatch(id, zoneEl){
    if(!id || ms.matched[id]) return;
    if(id === zoneEl.dataset.id){
      ms.matched[id] = true;
      ms.selected = null;
      render();
    } else {
      zoneEl.classList.remove('wrong');
      void zoneEl.offsetWidth;
      zoneEl.classList.add('wrong');
      setTimeout(()=>zoneEl.classList.remove('wrong'), 450);
      ms.selected = null;
      document.querySelectorAll('#matchLeft .match-chip.selected').forEach(c=>c.classList.remove('selected'));
    }
  }

  document.querySelectorAll('#matchLeft .match-chip').forEach(chip=>{
    if(chip.classList.contains('matched')) return;
    chip.onclick = ()=>{
      ms.selected = (ms.selected === chip.dataset.id) ? null : chip.dataset.id;
      render();
    };
    chip.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', chip.dataset.id);
    });
  });
  document.querySelectorAll('#matchRight .match-zone').forEach(zone=>{
    if(zone.classList.contains('matched')) return;
    zone.onclick = ()=>{ tryMatch(ms.selected, zone); };
    zone.addEventListener('dragover', (e)=>{ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', ()=>{ zone.classList.remove('over'); });
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      zone.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      tryMatch(id, zone);
    });
  });
}

function renderFundusPage(page){
  const answered = getFundusAnswered();
  const pins = getFundusPins(page);

  const optionsHtml = page.options.map((o)=>{
    let cls = 'opt-row';
    if(answered && o === page.correct) cls += ' correct';
    return `<label class="${cls}"><input type="radio" name="fopt" ${answered?'disabled':''} data-val="${esc(o)}"> ${esc(o)}</label>`;
  }).join('');

  const pinsHtml = (answered ? page.lesions : []).map((l,li)=>{
    const revealed = pins[li];
    return `<div class="pin ${revealed?'revealed':''}" data-li="${li}" style="left:${l.x}%;top:${l.y}%">${li+1}</div>` +
           (revealed ? `<div class="pin-label" style="left:${l.x}%;top:${l.y}%">${esc(l.label)}</div>` : '');
  }).join('');

  const doneCount = pins.filter(Boolean).length;
  const totalLesions = page.lesions.length;

  const body = `
    <div class="level-tag">${esc(page.level)} &middot; Slide ${page.slide} dari PPTX asli</div>
    <h2>Simulasi Grading Retinopati Diabetika</h2>
    <div class="title-underline"></div>
    <div class="fundus-layout">
      <div class="fundus-stage" id="fundusStage">
        <img src="${page.image}" alt="Fundus ${page.slide}">
        ${pinsHtml}
      </div>
      <div class="fundus-side">
        <div class="opt-list" id="optList">${optionsHtml}</div>
        ${totalLesions ? `<div class="fundus-progress">Lesi teridentifikasi: ${doneCount}/${totalLesions} &mdash; klik titik pada gambar untuk melihat nama lesi.</div>` : (answered ? `<div class="fundus-progress">Tidak ada temuan pada gambar ini (normal).</div>` : '')}
        <div class="reasoning-box" style="display:${answered?'block':'none'}"><b>Alasan:</b> ${esc(page.reasoning || '(tidak ada catatan pada slide ini)')}</div>
      </div>
    </div>
  `;
  document.getElementById('contentCard').innerHTML = cardShell(body);
  wireFooterNav();

  if(!answered){
    document.querySelectorAll('#optList .opt-row').forEach(row=>{
      row.onclick = ()=>{ state.fundusAnswered[fundusKey()] = true; render(); };
    });
  }
  document.querySelectorAll('#fundusStage .pin').forEach(pinEl=>{
    pinEl.onclick = ()=>{
      const li = parseInt(pinEl.dataset.li,10);
      const arr = getFundusPins(page);
      if(arr[li]) return;
      arr[li] = true;
      render();
    };
  });
}

function renderQuizPage(page){
  const key = pageKey();
  const chosen = state.quizAnswers[key];
  const answered = !!chosen;

  const optionsHtml = page.options.map(o=>{
    let cls = 'opt-row';
    if(answered){
      cls += ' disabled';
      if(o.letter === page.correct) cls += ' correct';
      else if(o.letter === chosen) cls += ' wrong';
    }
    return `<label class="${cls}" data-letter="${o.letter}">
      <input type="radio" name="qopt" ${answered?'disabled':''} ${chosen===o.letter?'checked':''}>
      <span class="letter">${o.letter}.</span> ${esc(o.text)}
    </label>`;
  }).join('');

  const body = `
    <div class="quiz-tag">Soal ${page.index+1} dari ${page.total} &middot; Pre/Post Test</div>
    <p class="quiz-question">${esc(page.question)}</p>
    <div class="opt-list" id="quizOptList">${optionsHtml}</div>
    <button class="submit-btn" id="quizSubmitBtn" ${answered?'disabled':''}>Submit</button>
    <div class="reasoning-box" style="display:${answered?'block':'none'}">
      <b>${answered && chosen===page.correct ? '&#10003; Benar.' : '&#10007; Kurang tepat.'}</b>
      Jawaban yang benar: <b>${esc(page.correct)}</b>. ${esc(page.explanation)}
    </div>
  `;
  document.getElementById('contentCard').innerHTML = cardShell(body);
  wireFooterNav();

  let picked = chosen || null;
  if(!answered){
    document.querySelectorAll('#quizOptList .opt-row').forEach(row=>{
      row.onclick = ()=>{
        picked = row.dataset.letter;
        document.querySelectorAll('#quizOptList .opt-row input').forEach(inp=>{
          inp.checked = (inp.closest('.opt-row').dataset.letter === picked);
        });
      };
    });
    document.getElementById('quizSubmitBtn').onclick = ()=>{
      if(!picked) return;
      state.quizAnswers[key] = picked;
      render();
    };
  }
}

function quizScoreSummary(){
  const evalMod = COURSE.find(m=>m.key==='evaluasi');
  if(!evalMod) return null;
  const quizPages = evalMod.pages.filter(p=>p.type==='quiz');
  const modIdx = COURSE.indexOf(evalMod);
  let correct = 0;
  quizPages.forEach((p, i)=>{
    const key = modIdx + '-' + (i+1);
    if(state.quizAnswers[key] === p.correct) correct++;
  });
  return { correct, total: quizPages.length };
}

function renderSelesai(){
  if(state.showCertificate){ renderCertificate(); return; }
  const score = quizScoreSummary();
  if(score){
    scormSetValue('cmi.core.score.raw', score.correct);
    scormSetValue('cmi.core.score.min', 0);
    scormSetValue('cmi.core.score.max', score.total);
  }
  scormSetValue('cmi.core.lesson_status', 'completed');
  document.getElementById('contentCard').innerHTML = `
    <div class="done-screen">
      <h1>TERIMA KASIH</h1>
      <p>Anda telah menyelesaikan Modul 1&ndash;4 (Bab 1&ndash;3, simulasi grading) dan evaluasi &mdash; Pelatihan Skrining Retinopati Diabetika.</p>
      ${score ? `<div class="score">Skor evaluasi: ${score.correct} / ${score.total}</div>` : ''}
      <p style="font-size:12px;opacity:.75;">Seluruh teks, gambar, narasi, titik lesi, dan soal pada kursus ini diekstrak dari file PPTX "SAMPLE MIPA_Modul_DRIVE.pptx".</p>
      <div class="cert-form">
        <input type="text" id="learnerNameInput" placeholder="Masukkan nama lengkap Anda" value="${esc(state.learnerName)}">
        <button id="certBtn">📜 Buat Sertifikat</button>
      </div>
      <button class="restart-btn" id="restartBtn">Ulangi Kursus</button>
    </div>
  `;
  document.getElementById('certBtn').onclick = ()=>{
    const val = document.getElementById('learnerNameInput').value.trim();
    if(!val){ alert('Mohon isi nama Anda terlebih dahulu.'); return; }
    state.learnerName = val;
    state.showCertificate = true;
    render();
  };
  document.getElementById('learnerNameInput').onkeydown = (e)=>{
    if(e.key === 'Enter') document.getElementById('certBtn').click();
  };
  document.getElementById('restartBtn').onclick = ()=>{
    stopSpeech();
    state.modIdx = 0; state.pageIdx = 0; state.furthestModIdx = 0;
    state.fundusAnswered = {}; state.fundusPins = {};
    state.revealCounts = {}; state.quizAnswers = {};
    state.hotspotVisited = {}; state.hotspotActive = {}; state.matchState = {};
    state.learnerName = ''; state.showCertificate = false;
    render();
  };
}

function renderCertificate(){
  const score = quizScoreSummary();
  const dateStr = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
  document.getElementById('contentCard').innerHTML = `
    <div class="certificate-wrap">
      <div class="certificate">
        <div class="cert-eyebrow">SERTIFIKAT PENYELESAIAN</div>
        <h1>DRIVE School</h1>
        <div class="cert-given">Dengan ini menyatakan bahwa</div>
        <div class="cert-name">${esc(state.learnerName)}</div>
        <div class="cert-desc">telah menyelesaikan pelatihan <b>&ldquo;Skrining Retinopati Diabetika untuk Dokter Layanan Primer&rdquo;</b>, mencakup Modul 1&ndash;4 (Diabetes Mellitus, Retinopati Diabetika, Skrining &amp; Tatalaksana, Simulasi Grading) beserta evaluasi pre/post-test.</div>
        <div class="cert-meta">
          <div><b>${dateStr}</b>Tanggal selesai</div>
          ${score ? `<div><b>${score.correct} / ${score.total}</b>Skor evaluasi</div>` : ''}
        </div>
      </div>
      <div class="cert-actions">
        <button class="cert-print-btn" id="printCertBtn">🖨 Cetak / Simpan sebagai PDF</button>
        <button class="cert-back-btn" id="backFromCertBtn">&#8592; Kembali</button>
      </div>
    </div>
  `;
  document.getElementById('printCertBtn').onclick = ()=>{ window.print(); };
  document.getElementById('backFromCertBtn').onclick = ()=>{ state.showCertificate = false; render(); };
}

function render(){
  renderSidebar();
  const mod = COURSE[state.modIdx];
  if(mod.key === 'selesai'){ renderSelesai(); return; }
  const page = mod.pages[state.pageIdx];
  if(mod.key === 'pengantar' && state.pageIdx === 0){ renderPengantarHero(page); return; }
  if(page.type === 'divider'){ renderDivider(page); return; }
  if(page.type === 'fundus'){ renderFundusPage(page); return; }
  if(page.type === 'quiz'){ renderQuizPage(page); return; }
  if(page.type === 'cards'){ renderCardsPage(page); return; }
  if(page.type === 'hotspot'){ renderHotspotPage(page); return; }
  if(page.type === 'match'){ renderMatchPage(page); return; }
  renderContentPage(page);
}

scormInit();
render();
</script>
</body>
</html>
