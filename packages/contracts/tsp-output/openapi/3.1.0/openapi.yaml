components:
  parameters:
    Common.OrderByParam:
      name: orderBy
      in: query
      required: false
      description: Sort order configuration matching standard patterns (e.g. `createdAt:desc`).
      schema:
        type: string
      explode: false
    Common.PageParams.page:
      name: page
      in: query
      required: false
      description: 'The page index to retrieve (default: 1).'
      schema:
        type: integer
        format: int32
        default: 1
      explode: false
    Common.PageParams.pageSize:
      name: pageSize
      in: query
      required: false
      description: 'The maximum number of records to return on a page (default: 50).'
      schema:
        type: integer
        format: int32
        default: 50
      explode: false
    Common.SearchParam.q:
      name: q
      in: query
      required: false
      description: Short query alias parameter.
      schema:
        type: string
      explode: false
    Common.SearchParam.search:
      name: search
      in: query
      required: false
      description: Query string matching wildcard terms.
      schema:
        type: string
      explode: false
  schemas:
    AccountStatus:
      type: string
      enum:
        - active
        - suspended
    AdminGrowth30d:
      type: object
      required:
        - newUsers
        - newCourses
        - newEnrollments
        - newInstitutions
      properties:
        newUsers:
          type: integer
          format: int32
        newCourses:
          type: integer
          format: int32
        newEnrollments:
          type: integer
          format: int32
        newInstitutions:
          type: integer
          format: int32
    AdminOverview:
      type: object
      required:
        - totalUsers
        - totalInstitutions
        - totalCourses
        - totalEnrollments
        - activeParticipants
        - graduatedParticipants
        - completionRate
        - growth30d
      properties:
        totalUsers:
          type: integer
          format: int32
        totalInstitutions:
          type: integer
          format: int32
        totalCourses:
          type: integer
          format: int32
        totalEnrollments:
          type: integer
          format: int32
        activeParticipants:
          type: integer
          format: int32
          description: selected enrollments.
        graduatedParticipants:
          type: integer
          format: int32
        completionRate:
          type: integer
          format: int32
          description: graduated as a percent of selected+graduated, rounded.
        growth30d:
          $ref: '#/components/schemas/AdminGrowth30d'
    Announcement:
      type: object
      required:
        - id
        - courseId
        - title
        - content
        - user
        - isPublished
        - isPinned
        - priority
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        courseId:
          $ref: '#/components/schemas/Common.ResourceId'
        title:
          type: string
        content:
          type: string
        user:
          $ref: '#/components/schemas/AnnouncementUser'
        isPublished:
          type: boolean
          description: Draft announcements stay invisible to participants.
        publishedAt:
          type: string
          format: date-time
        isPinned:
          type: boolean
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
        createdAt:
          type: string
          format: date-time
          readOnly: true
    AnnouncementCreate:
      type: object
      required:
        - courseId
        - title
        - content
      properties:
        courseId:
          $ref: '#/components/schemas/Common.ResourceId'
        title:
          type: string
        content:
          type: string
        isPublished:
          type: boolean
        isPinned:
          type: boolean
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
    AnnouncementPriority:
      type: string
      enum:
        - normal
        - high
    AnnouncementUser:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        name:
          type: string
    Assignment:
      type: object
      required:
        - id
        - courseId
        - title
        - maxScore
        - allowLateSubmission
        - lateSubmissionPenalty
        - allowedFileTypes
        - maxFiles
        - isActive
        - submissionCount
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        courseId:
          $ref: '#/components/schemas/Common.ResourceId'
        lessonId:
          $ref: '#/components/schemas/Common.ResourceId'
        title:
          type: string
        description:
          type: string
        instructions:
          type: string
        maxScore:
          type: integer
          format: int32
        dueDate:
          type: string
          format: date-time
        allowLateSubmission:
          type: boolean
        lateSubmissionPenalty:
          type: integer
          format: int32
          description: Percent of the score deducted from late submissions at grading time.
        allowedFileTypes:
          type: array
          items:
            type: string
        maxFileSize:
          type: integer
          format: int32
        maxFiles:
          type: integer
          format: int32
        isActive:
          type: boolean
        submissionCount:
          type: integer
          format: int32
          description: |-
            Computed on read - avoids the editor's assignment list making one
            request per row just to show "N dikumpulkan".
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
    AssignmentAttachment:
      type: object
      required:
        - uploadId
        - url
        - name
        - size
        - mimeType
      properties:
        uploadId:
          type: string
        url:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int32
        mimeType:
          type: string
    AssignmentCreate:
      type: object
      required:
        - title
      properties:
        lessonId:
