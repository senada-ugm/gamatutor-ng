  /uploads:
    post:
      operationId: UploadsApi_create
      description: |-
        Uploads a file immediately on client-side selection, ahead of the
        surrounding form's submit. Modeled here as `multipart/form-data`
        for documentation and validation purposes, but apps/web does NOT
        use the generated SDK client for this call — that client is
        fetch-based with no upload-progress events, so the web app
        hand-rolls an XMLHttpRequest against this same route instead (see
        apps/web/lib/uploads.ts). Field order matters to the server's
        multipart parser: send `purpose` before `file`.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Upload'
                    description: The raw payload representation.
                  meta:
                    $ref: '#/components/schemas/Common.ResponseMeta'
                    description: Trace metadata.
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Common.Warning'
                    description: Minor warning list.
                description: Standard single resource response envelope.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
      tags:
        - Uploads
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                file: {}
              required:
                - purpose
                - file
            encoding:
              file:
                contentType: '*/*'
