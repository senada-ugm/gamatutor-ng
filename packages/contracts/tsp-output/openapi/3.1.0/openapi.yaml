openapi: 3.1.0
info:
  title: LMS Contracts
  description: |-
    LMS API contracts — single source of truth for shapes. The web mockup
    (apps/web/lib/mock/*) types its fixtures against the generated schemas so
    drift between mockup and contract is a typecheck error.

    Layout mirrors the vamios-core standard: `shared/common.tsp` carries the
    cross-cutting envelopes (DataResponse / PagedResponse / ErrorResponse,
    ResponseMeta, pagination + query params); domain files carry resources
    and their operations. Scope discipline: model only what exists in the
    product today — adding a model here is an API design decision, not a
    filler exercise.
  version: 0.0.0
tags:
  - name: Health
    description: "Service liveness probe."
  - name: Courses
    description: "Course catalog: authoring, publishing, and retrieval. Creating and editing requires institution ownership."
  - name: Course Content
    description: "Module and lesson authoring inside a course, plus learner lesson-progress tracking."
  - name: Course Instructors
    description: "Per-course instructor roster: invites, roles, and removal."
  - name: Enrollments
    description: "Learner enrollment lifecycle (registered → interviewed → selected → graduated) and participant profiles."
  - name: Quizzes
    description: "Quiz and question authoring, learner attempts and grading, plus platform-wide assessments."
  - name: Assignments
    description: "Assignment authoring, learner submissions, and grading."
  - name: Discussions
    description: "Per-course discussion threads, replies, and moderation (pin/close/resolve)."
  - name: Certificates
    description: "Certificate issuance and public verification by code."
  - name: Certificate Settings
    description: "Per-course certificate template: signature list configuration."
  - name: Uploads
    description: "General file uploads with claim/release lifecycle and orphan sweep."
  - name: Announcements
  - name: Platform Settings
  - name: Notifications
  - name: Reports
  - name: Telemetry
  - name: Institutions
    description: "Institution registration (admin-direct) and profile management."
  - name: Institution Requests
    description: "Self-service institution registration queue — any signed-in account submits, admins approve or reject."
  - name: Institution Ownerships
    description: "Ownership grants linking accounts to the institutions they administer."
  - name: Users
    description: "Platform user administration: listing, search, suspension. Admin-only."
  - name: Audit Log
    description: "Append-only trail of privileged administrative actions."
paths:
  /admin/overview:
    get:
      operationId: AdminReportsApi_get
      description: Platform totals + 30-day growth for the admin dashboard. Admin only.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOverview'
                    description: The raw payload representation.
                  meta:
                    $ref: '#/components/schemas/Common.ResponseMeta'
                    description: Trace metadata.
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Common.Warning'
                    description: Minor warning list.
                description: Standard single resource response envelope.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
      tags:
        - Reports
