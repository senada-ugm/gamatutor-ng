      type: object
      required:
        - code
        - message
      properties:
        field:
          type: string
          description: The specific schema path or request parameter field that failed validation.
        code:
          type: string
          description: The machine-readable error sub-code identifying the validation rule that was violated.
        message:
          type: string
          description: A descriptive message explaining why the field failed validation.
        metadata:
          type: object
          unevaluatedProperties: {}
          description: Optional context-specific metadata detailing the validation violation constraints.
      description: Detailed validation or sub-error metadata representing individual model errors.
    Common.ErrorObject:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable explanation of the error.
        details:
          type: array
          items:
            $ref: '#/components/schemas/Common.ErrorDetail'
          description: Individual field validation failure messages.
        requestId:
          type: string
          description: Unique request trace identifier for troubleshooting.
        documentationUrl:
          type: string
          description: Link pointing to the troubleshooting manual.
      description: Standard error container object.
    Common.ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Common.ErrorObject'
          description: The structured error detail container.
      description: Standard error response envelope returned on non-2xx failures.
    Common.PageLinks:
      type: object
      required:
        - first
        - last
      properties:
        first:
          type: string
          description: The URL for the first page of results.
        previous:
          type: string
          description: The URL for the previous page of results (null if on the first page).
        next:
          type: string
          description: The URL for the next page of results (null if on the last page).
        last:
          type: string
          description: The URL for the last page of results.
      description: Standard page-based pagination links for easy client-side API navigation.
    Common.PagePagination:
      type: object
      required:
        - page
        - pageSize
        - totalPages
        - totalCount
        - hasNext
        - hasPrevious
        - links
      properties:
        page:
          type: integer
          format: int32
          description: The current page number (1-indexed).
        pageSize:
          type: integer
          format: int32
          description: The number of items returned per page.
        totalPages:
          type: integer
          format: int32
          description: The total number of pages available.
        totalCount:
          type: integer
          format: int64
          description: The total number of items matching the query across all pages.
        hasNext:
          type: boolean
          description: Indicates if there is a subsequent page of results.
        hasPrevious:
          type: boolean
          description: Indicates if there is a preceding page of results.
        links:
          $ref: '#/components/schemas/Common.PageLinks'
          description: Navigation links for traversing pages.
        requestedPageSize:
          type: integer
          format: int32
          description: The original requested page size if it was capped by the server.
      description: Standard page-based pagination metadata.
    Common.ResourceId:
      type: string
      pattern: ^[a-z]{2,5}_[a-zA-Z0-9]+$
      description: |-
        Standard type-safe prefixed resource identifier scalar (e.g. `usr_x1Y2`,
        `ins_aBc3`). Mock fixtures still use readable slugs like "institution-1"
        — the real API mints prefixed ids.
    Common.ResponseMeta:
      type: object
      required:
        - requestId
        - timestamp
      properties:
        requestId:
          type: string
          description: Unique tracing identifier for request lifecycle debugging.
        timestamp:
          type: string
          format: date-time
          description: Timestamp representing when the response was processed.
        apiVersion:
          type: string
          description: Active version identifier of the serving endpoint.
        durationMs:
          type: integer
          format: int64
          description: Total elapsed backend execution duration in milliseconds.
      description: Metadata envelope included in all API responses.
    Common.StandardErrorCode:
      type: string
      enum:
        - badRequest
        - validationError
        - unauthorized
        - tokenExpired
        - forbidden
        - insufficientPermissions
        - notFound
        - conflict
        - duplicate
        - unprocessableEntity
        - rateLimitExceeded
        - internalError
        - serviceUnavailable
      description: Standard HTTP API error codes.
    Common.ValidationErrorCode:
      type: string
      enum:
        - required
        - invalidFormat
        - invalidType
        - outOfRange
        - tooShort
        - tooLong
        - alreadyExists
        - notFound
      description: Standard validation error codes.
    Common.Warning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: The unique identifier of the warning code.
        message:
          type: string
          description: Readable text content specifying the warning trigger.
        sunsetDate:
          type: string
          format: date-time
          description: Sunset date when the deprecated endpoint or API will be deactivated.
        alternative:
          type: string
          description: Recommendation of an alternative endpoint or API pattern.
        documentationUrl:
          type: string
          description: Documentation index link detailing the warning scenario.
      description: Warning object included in responses representing deprecation or usage notices.
