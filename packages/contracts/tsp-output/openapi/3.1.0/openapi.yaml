      description: |-
        Batch read behind a roster page: the profiles for up to 200
        comma-separated `userIds`, one call instead of one per row. Access
        is decided per id by the same rule `get` applies, and ids the
        caller may not read are omitted rather than failing the call - a
        roster row for an account the caller has no claim on degrades to
        its id instead of blanking the page. Identity numbers are masked
        here for every id but the caller's own, exactly as in `get`.
      parameters:
        - name: userIds
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ParticipantProfile'
                    description: The raw payload representation.
                  meta:
                    $ref: '#/components/schemas/Common.ResponseMeta'
                    description: Trace metadata.
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Common.Warning'
                    description: Minor warning list.
                description: Standard single resource response envelope.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ErrorResponse'
      tags:
        - Enrollments
