          type: array
          items:
            type: string
        points:
          type: integer
          format: int32
        explanation:
          type: string
        displayOrder:
          type: integer
          format: int32
    QuizUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        passingScore:
          type: integer
          format: int32
        maxAttempts:
          type: integer
          format: int32
        timeLimit:
          type: integer
          format: int32
          description: Time limit in minutes; 0/null = no limit. Enforced server-side at submit.
        shuffleQuestions:
          type: boolean
        shuffleOptions:
          type: boolean
        showResults:
          type: boolean
        showCorrectAnswers:
          type: boolean
    RegisteredInstitution:
      type: object
      required:
        - id
        - name
        - institutionType
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        name:
          type: string
        institutionType:
          type: string
        description:
          type: string
        website:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        logo:
          anyOf:
            - type: string
            - type: 'null'
          description: |-
            Optional logo — shown next to the institution's name wherever a
            course card credits its provider. Uploaded via UploadsApi
            (purpose "logo") the same way Course.thumbnail is.
        metadata:
          type: object
          unevaluatedProperties: {}
          description: |-
            Opaque free-form bag — key/value extension point. The API stores and
            returns it verbatim; the schema of the contents is the caller's.
        status:
          type: string
          enum:
            - approved
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      description: An approved institution — a training provider on the platform.
    ReportUser:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        name:
          type: string
        email:
          type: string
    RequesterInfo:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
      description: Display copy of the requesting account, denormalized.
    TelemetryEvent:
      type: object
      required:
        - id
        - userId
        - courseId
        - moduleId
        - slideId
        - eventType
        - dwellTimeSeconds
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        userId:
          $ref: '#/components/schemas/Common.ResourceId'
        courseId:
          $ref: '#/components/schemas/Common.ResourceId'
        moduleId:
          type: string
        slideId:
          type: string
        eventType:
          type: string
        dwellTimeSeconds:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    TelemetryEventCreate:
      type: object
      required:
        - courseId
        - moduleId
        - slideId
        - eventType
      properties:
        courseId:
          $ref: '#/components/schemas/Common.ResourceId'
        moduleId:
          type: string
        slideId:
          type: string
        eventType:
          type: string
        dwellTimeSeconds:
          type: integer
          format: int32
        interactionData:
          type: object
          unevaluatedProperties: {}
    TrainingType:
      type: string
      enum:
        - pbk
        - wirausaha
        - lainnya
    Upload:
      type: object
      required:
        - id
        - purpose
        - originalFilename
        - mimeType
        - sizeBytes
        - url
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        purpose:
          type: string
          description: |-
            Caller-supplied tag for what this file is for, e.g.
            "course-thumbnail" — free-form, not an enum, so new callers don't
            need a contract change just to start uploading.
        originalFilename:
          type: string
          readOnly: true
        mimeType:
          type: string
          readOnly: true
        sizeBytes:
          type: integer
          format: int64
          readOnly: true
        url:
          type: string
          description: |-
            Where the uploaded bytes can be fetched back from
            (`GET /uploads/{id}/file`). This is the value callers store on
            their own entity (e.g. Course.thumbnail) to reference the file.
          readOnly: true
        status:
          $ref: '#/components/schemas/UploadStatus'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
    UploadStatus:
      type: string
      enum:
        - unclaimed
        - claimed
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - status
        - joinedAt
      properties:
        id:
          $ref: '#/components/schemas/Common.ResourceId'
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
          description: |-
            Global account role only — institution ownership is a separate join
            (InstitutionOwnership), not a role value.
        status:
          $ref: '#/components/schemas/AccountStatus'
          readOnly: true
        joinedAt:
          type: string
          format: date-time
          readOnly: true
        suspendedAt:
          type: string
          format: date-time
          readOnly: true
        suspendedReason:
          type: string
          readOnly: true
      description: A platform account — the identity behind every role.
    UserCapabilities:
      type: object
      required:
        - userId
        - ownedInstitutionIds
        - isInstructor
      properties:
        userId:
          $ref: '#/components/schemas/Common.ResourceId'
        ownedInstitutionIds:
          type: array
          items:
            $ref: '#/components/schemas/Common.ResourceId'
        isInstructor:
          type: boolean
          description: True when the user holds at least one ACTIVE course-instructor assignment.
    UserRole:
      type: string
      enum:
        - user
        - admin
      description: |-
        The account's global trust tier - the only real "role." Every other
        capability (teaching a course, owning an institution, being enrolled
        as a learner) is membership data, not a role: see InstitutionOwnership,
        course-instructors.tsp's CourseInstructor, and enrollments.tsp's
        Enrollment - all self-service, all acquired through normal product use
        (request+approval, an invite, hitting enroll). "admin" is the one tier
        that can't be self-acquired that way; it must be granted by an existing
        admin, which is why it alone stays a stored role instead of a derived
        join. (The web app's session has a separate AppSection concept for
        which UI chrome/nav is showing - that's a navigation detail, not an
        account attribute, and keeps its 4 values: student/instructor/
        institution_owner/admin.)
    UserSuspend:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
