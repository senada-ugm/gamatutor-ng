# GamaTutor — https://gamatutor.komunitech.id
#
# Static only, for now. Slice S0 produced a standalone SCORM package and
# nothing server-side, so this vhost serves built courses out of
# /var/www/gamatutor/courses/<id>/ and a placeholder at the root.
#
# The root is deliberately a placeholder rather than a course: slice S1 puts
# the Next.js platform at /, and a course squatting the root would have to be
# moved later, breaking whatever links had been shared by then.
#
# Managed from the repo: deploy/nginx/gamatutor.komunitech.id.conf.
# Edit it there and run tools/deploy.sh — do not hand-edit on the server, and
# do not let `certbot --nginx` rewrite it (we use `certbot certonly --webroot`
# precisely so this file stays authoritative).

server {
    listen 80;
    listen [::]:80;
    server_name gamatutor.komunitech.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx on this host is 1.24, which predates the `http2 on;` directive
    # (1.25.1+). Keep the listen-flag form until the box is upgraded.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gamatutor.komunitech.id;

    ssl_certificate     /etc/letsencrypt/live/gamatutor.komunitech.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamatutor.komunitech.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gamatutor;
    index index.html;

    # A published course is a fixed set of files. There is no client-side
    # routing anywhere in the player, so a missing file must 404 rather than
    # fall back to index.html — an SPA fallback would answer a missing asset
    # with HTML and status 200, which is far harder to debug than a 404.
    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Course pages inline their CSS, the player bundle and course.json, so the
    # HTML changes on every rebuild and must not be cached.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Course media is content that changes only when the course is rebuilt, and
    # a rebuild ships new filenames or an operator-initiated purge. A day is a
    # reasonable compromise until the platform starts hashing asset names.
    location ~* ^/courses/[^/]+/assets/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # imsmanifest.xml is only meaningful inside a downloaded package; serving it
    # over the web invites confusion about what this URL is.
    location ~* /imsmanifest\.xml$ {
        return 404;
    }

    # The DRIVE course ships an mp4; without this, seeking in the video does
    # not work on some browsers.
    location ~* \.mp4$ {
        mp4;
        add_header Accept-Ranges bytes;
    }

    # No embedding: the player runs top-level here, and a SCORM package
    # imported into an LMS is served from that LMS, not from this host.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/gamatutor.access.log;
    error_log  /var/log/nginx/gamatutor.error.log;
}
