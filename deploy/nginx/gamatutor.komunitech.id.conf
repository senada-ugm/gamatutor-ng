# GamaTutor — https://gamatutor.komunitech.id
#
# One origin for both containers of compose.prod.yaml (ports from
# deploy/compose.vps.yaml):
#   - api (Fastify)  127.0.0.1:8120 — /v1/, /api/auth/, /health
#   - app (Vite SPA) 127.0.0.1:3120 — everything else
# Same origin keeps the Better Auth session cookie first-party.
#
# Installed by scripts/deploy-vps.sh. Edit here, not on the server, and do not
# let `certbot --nginx` rewrite it (certificates use `certonly --webroot`).

server {
    listen 80;
    listen [::]:80;
    server_name gamatutor.komunitech.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx on this host is 1.24, which predates `http2 on;` (1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gamatutor.komunitech.id;

    ssl_certificate     /etc/letsencrypt/live/gamatutor.komunitech.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamatutor.komunitech.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The standalone 3D eye atlas, kept from the previous deployment.
    location ^~ /anatomi-mata/ {
        root /var/www/gamatutor;
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------------- api

    # The SPA calls /api/v1/*; /v1/* is the same api without the prefix.
    location ~ ^/(api/)?v1/ {
        proxy_pass http://127.0.0.1:8120;
        include /etc/nginx/snippets/gamatutor-proxy.conf;
        # Largest upload cap in the api is video at 200MB.
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8120;
        include /etc/nginx/snippets/gamatutor-proxy.conf;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8120;
        include /etc/nginx/snippets/gamatutor-proxy.conf;
    }

    # ---------------------------------------------------------------- app
    # The lms container serves the SPA (and /api/v1, /api/auth) itself.

    location / {
        proxy_pass http://127.0.0.1:8120;
        include /etc/nginx/snippets/gamatutor-proxy.conf;
    }

    access_log /var/log/nginx/gamatutor.access.log;
    error_log  /var/log/nginx/gamatutor.error.log;
}
