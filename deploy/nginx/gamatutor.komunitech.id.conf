# GamaTutor — https://gamatutor.komunitech.id
#
# Two kinds of content share this host:
#
# - the platform (Next.js, slice S1+), proxied to 127.0.0.1:3110 — accounts,
#   catalogue, the player at /belajar/, certificates and admin reports;
# - static files: the DRIVE landing page at /, built SCORM packages under
#   /courses/ (for use inside other LMSs, and as a public preview), the
#   platform mockup at /app/ and the 3D atlas at /anatomi-mata/.
#
# Managed from the repo: deploy/nginx/gamatutor.komunitech.id.conf.
# Edit it there and run tools/deploy.sh — do not hand-edit on the server, and
# do not let `certbot --nginx` rewrite it (we use `certbot certonly --webroot`
# precisely so this file stays authoritative).

server {
    listen 80;
    listen [::]:80;
    server_name gamatutor.komunitech.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx on this host is 1.24, which predates the `http2 on;` directive
    # (1.25.1+). Keep the listen-flag form until the box is upgraded.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gamatutor.komunitech.id;

    ssl_certificate     /etc/letsencrypt/live/gamatutor.komunitech.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamatutor.komunitech.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gamatutor;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ------------------------------------------------------------ static

    # The DRIVE landing page is the front door; its buttons lead into the
    # platform (/daftar, /masuk, /kursus).
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    # Built course packages. Every regex rule for them lives inside this
    # prefix block, so a regex can never catch a platform URL by accident
    # (the platform streams its own .mp4 course assets with access checks).
    location ^~ /courses/ {
        # No client-side routing in the player: a missing file is a 404, not
        # an SPA fallback answering with HTML and status 200.
        try_files $uri $uri/ =404;

        # Course pages inline CSS, the player and course.json; never cache.
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* ^/courses/[^/]+/assets/.+\.mp4$ {
            mp4;
            expires 1d;
            add_header Accept-Ranges bytes;
        }
        location ~* ^/courses/[^/]+/assets/ {
            expires 1d;
            add_header Cache-Control "public";
        }
        # imsmanifest.xml only means something inside a downloaded package.
        location ~* /imsmanifest\.xml$ {
            return 404;
        }
    }

    location ^~ /app/ {
        try_files $uri $uri/ =404;
    }

    location ^~ /anatomi-mata/ {
        try_files $uri $uri/ =404;
    }

    # ---------------------------------------------------------- platform

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    access_log /var/log/nginx/gamatutor.access.log;
    error_log  /var/log/nginx/gamatutor.error.log;
}
