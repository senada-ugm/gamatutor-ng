# Shared proxy headers for gamatutor.komunitech.id.conf (installed to
# /etc/nginx/snippets/). The api runs with TRUST_PROXY=true and keys its rate
# limits on X-Forwarded-For, so overwrite it rather than append to it.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
