<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GamaTutor · Pratinjau</title>
<meta name="description" content="Pratinjau antarmuka platform GamaTutor untuk peserta dan admin. Belum berfungsi; data contoh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     GamaTutor platform mockup, served at /app/.

     One file, installed verbatim by tools/deploy.sh. Every screen here
     is a picture of a slice that is not built yet (S1 to S5 in the
     design spec); nothing is stored and every number is sample data.
     The role switch exists so a reviewer can see both sides: learners
     get a light top bar, admins a navy sidebar, so the two can never be
     mistaken for each other in a screenshot.
     --------------------------------------------------------------- */

  :root{
    --page:#fbfdfe;
    --tint:#eaf5f5;
    --ink:#0f2a44;
    --ink-soft:#46607a;
    --ink-faint:#6b8196;
    --line:#d5e1ea;
    --teal:#137a77;
    --teal-bright:#5bb4b2;
    --amber:#f2902e;
    --navy:#132d47;
    --navy-raised:#1b3d5f;
    --navy-line:rgba(170,200,225,.18);
    --warn-bg:#fff4e6;
    --warn-ink:#8a4b0f;
    --ease:cubic-bezier(.2,.7,.2,1);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--page);color:var(--ink);
    font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--teal);text-underline-offset:.2em}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  /* Focus moves to main on navigation for screen readers; it needs no ring. */
  #main:focus{outline:none}
  h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}
  h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800}
  h2{font-size:1.2rem;font-weight:700}
  h3{font-size:1rem;font-weight:700}
  p{margin:0}
  [hidden]{display:none !important}

  /* ------------------------------------------------------- preview strip
     Always on screen. This is a picture of software, and it says so. */
  .strip{
    background:var(--warn-bg);color:var(--warn-ink);
    font-size:.875rem;padding:.55rem 1rem;text-align:center;
    border-bottom:1px solid #f3d9b8;
  }
  .strip a{color:inherit;font-weight:600}

  /* ------------------------------------------------------------- layouts */
  .shell{min-height:calc(100vh - 38px)}

  /* Learner: a light top bar, content centred. */
  .topbar{
    display:flex;align-items:center;gap:1.75rem;flex-wrap:wrap;
    padding:.9rem clamp(1rem,4vw,3rem);
    border-bottom:1px solid var(--line);background:#fff;
  }
  .logo{display:flex;align-items:center;gap:.55rem;font-weight:800;letter-spacing:-.02em;font-size:1.0625rem;color:inherit;text-decoration:none}
  .logo svg{width:26px;height:26px}
  .topnav{display:flex;gap:.25rem;flex-wrap:wrap}
  .topnav a{
    color:var(--ink-soft);text-decoration:none;font-weight:600;font-size:.9375rem;
    padding:.55rem .8rem;min-height:44px;display:inline-flex;align-items:center;
    border-bottom:2px solid transparent;
  }
  .topnav a:hover{color:var(--ink)}
  .topnav a[aria-current="page"]{color:var(--teal);border-bottom-color:var(--teal)}
  .who{margin-left:auto;display:flex;align-items:center;gap:.6rem;font-size:.9375rem}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex:0 0 34px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.8125rem;background:var(--tint);color:var(--teal);
  }
  .learner-main{max-width:1080px;margin-inline:auto;padding:clamp(1.75rem,4vw,3rem) clamp(1rem,4vw,3rem) 6rem}

  /* Admin: navy sidebar, wide working area. */
  .admin{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .side{
    background:var(--navy);color:#dce8f3;
    padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1.5rem;
    position:sticky;top:0;height:calc(100vh - 38px);overflow:auto;
  }
  .side .logo{color:#fff}
  .role-badge{
    display:inline-block;margin-left:.15rem;
    font-size:.75rem;font-weight:700;color:var(--navy);
    background:var(--amber);padding:.1rem .45rem;
  }
  .sidenav{display:flex;flex-direction:column;gap:2px}
  .sidenav a{
    color:#c4d4e3;text-decoration:none;font-weight:500;font-size:.9375rem;
    padding:.6rem .75rem;min-height:44px;display:flex;align-items:center;gap:.7rem;
    border-left:3px solid transparent;
  }
  .sidenav a:hover{background:var(--navy-raised);color:#fff}
  .sidenav a[aria-current="page"]{background:var(--navy-raised);color:#fff;border-left-color:var(--teal-bright)}
  .sidenav .slice{margin-left:auto;font-size:.75rem;color:#8fa9c0}
  .side-foot{margin-top:auto;font-size:.875rem;color:#9fb6ca;border-top:1px solid var(--navy-line);padding-top:1rem}
  .admin-main{padding:clamp(1.5rem,3vw,2.5rem) clamp(1rem,3vw,2.75rem) 6rem;min-width:0}

  /* ---------------------------------------------------------- page parts */
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.75rem}
  .head p{color:var(--ink-soft);margin-top:.4rem;max-width:60ch}
  .soon{
    display:inline-flex;align-items:center;gap:.4rem;
    font-size:.8125rem;font-weight:600;color:var(--warn-ink);
    background:var(--warn-bg);padding:.25rem .6rem;border:1px solid #f3d9b8;
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    font:700 .9375rem/1 "Plus Jakarta Sans",system-ui,sans-serif;
    padding:.85rem 1.3rem;min-height:46px;cursor:pointer;text-decoration:none;
    border:1.5px solid var(--teal);background:var(--teal);color:#fff;
    transition:background .16s var(--ease);
  }
  .btn:hover{background:#0e625f;color:#fff}
  .btn.ghost{background:#fff;color:var(--teal)}
  .btn.ghost:hover{background:var(--tint)}
  .btn[aria-disabled="true"]{background:#eef2f5;border-color:var(--line);color:var(--ink-faint);cursor:not-allowed}

  .panel{background:#fff;border:1px solid var(--line);padding:clamp(1.1rem,2.5vw,1.6rem)}
  .panel + .panel{margin-top:1.25rem}
  .grid{display:grid;gap:1.25rem}
  .note{font-size:.875rem;color:var(--ink-faint)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:1.25rem}
  .stat{background:#fff;padding:1rem 1.2rem}
  .stat dt{font-size:.875rem;color:var(--ink-faint)}
  .stat dd{margin:.15rem 0 0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
  .stat dd small{font-size:.875rem;font-weight:500;color:var(--ink-soft);margin-left:.3rem}

  table{width:100%;border-collapse:collapse;font-size:.9375rem}
  th{text-align:left;font-size:.8125rem;font-weight:600;color:var(--ink-faint);padding:.6rem .75rem;border-bottom:1.5px solid var(--line);white-space:nowrap}
  td{padding:.7rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  .tag{display:inline-block;font-size:.8125rem;font-weight:600;padding:.15rem .5rem;background:var(--tint);color:var(--teal)}
  .tag.amber{background:#fdecd9;color:#8a4b0f}
  .tag.grey{background:#eef2f5;color:var(--ink-soft)}
  code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:#eef2f5;padding:.1rem .35rem}

  .bar{height:8px;background:#e7eef3;position:relative;min-width:80px}
  .bar span{position:absolute;inset:0 auto 0 0;background:var(--teal-bright)}
  .bar.amber span{background:var(--amber)}

  /* Learner course card. */
  .course{display:grid;gap:1.25rem;align-items:center}
  .course-img{width:120px;height:120px;border-radius:50%;overflow:hidden;background:#000;flex:0 0 120px}
  .course-img img{width:112%;height:112%;margin:-6%;object-fit:cover;display:block}
  .course h2{font-size:1.25rem}
  .course .meta{color:var(--ink-soft);font-size:.9375rem;margin-top:.2rem}
  .progress{margin-top:1rem;display:flex;align-items:center;gap:.8rem;font-size:.875rem;color:var(--ink-soft)}
  .progress .bar{flex:1;max-width:320px}

  form.inline{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
  input[type=text],input[type=email],input[type=password]{
    font:500 1rem "Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);
    border:1.5px solid var(--line);padding:.75rem .9rem;min-height:46px;min-width:0;flex:1;background:#fff;
  }
  input:focus{border-color:var(--teal);outline:none}
  label{font-size:.875rem;font-weight:600;display:block;margin-bottom:.35rem}
  .field + .field{margin-top:1rem}
  .flash{margin-top:.8rem;font-size:.9rem;color:var(--warn-ink);background:var(--warn-bg);padding:.6rem .8rem}

  /* Empty and blocked states share one shape: a mark, a sentence, a way on. */
  .state{max-width:520px;margin:3rem auto;text-align:center}
  .state svg{width:72px;height:72px;margin-bottom:1rem}
  .state h1{font-size:1.5rem}
  .state p{color:var(--ink-soft);margin:.6rem auto 1.5rem}
  .state .actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}

  /* Funnel: one row per module. */
  .funnel{display:grid;gap:.6rem}
  .funnel div{display:grid;grid-template-columns:minmax(8rem,14rem) minmax(0,1fr) 3.5rem;gap:.8rem;align-items:center;font-size:.9375rem}
  .funnel .bar{height:18px}

  .login{max-width:420px;margin:3rem auto}
  .login .panel{padding:1.75rem}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.25rem}

  /* ---------------------------------------------------------- role dock
     A reviewing tool, not part of the product: fixed bottom right, dark,
     so it never reads as a control the real app will have. */
  .dock{
    position:fixed;right:1rem;bottom:1rem;z-index:20;
    background:#0f2a44;color:#fff;padding:.4rem;display:flex;align-items:center;gap:.25rem;
    box-shadow:0 10px 30px rgba(15,42,68,.3);font-size:.875rem;
  }
  .dock span{padding:0 .5rem;color:#a9c0d4}
  .dock button{
    font:600 .875rem/1 "Plus Jakarta Sans",system-ui,sans-serif;
    background:transparent;color:#dce8f3;border:0;cursor:pointer;
    padding:.6rem .85rem;min-height:40px;
  }
  .dock button[aria-pressed="true"]{background:#fff;color:var(--ink)}
  .dock :focus-visible{outline-color:#fff}

  @media (min-width:760px){
    .course{grid-template-columns:120px minmax(0,1fr) auto}
    .grid.two{grid-template-columns:1fr 1fr}
  }
  @media (max-width:899px){
    .admin{grid-template-columns:1fr}
    .side{position:static;height:auto;padding:1rem}
    .sidenav{flex-direction:row;flex-wrap:wrap}
    .sidenav a{border-left:0;border-bottom:3px solid transparent}
    .sidenav a[aria-current="page"]{border-bottom-color:var(--teal-bright)}
    .sidenav .slice,.side-foot{display:none}
    .who span{display:none}
  }
  @media (max-width:560px){
    .funnel div{grid-template-columns:1fr 3rem}
    .funnel div .bar{grid-column:1 / -1;grid-row:2}
    .dock span{display:none}
  }
</style>
</head>
<body>

<div class="strip" role="note">Pratinjau tampilan platform. Belum ada yang tersimpan, dan semua angka adalah data contoh.
  Kursus yang sudah berjalan: <a href="/courses/drive-retinopati/">DRIVE</a>.</div>

<div id="app" class="shell"></div>

<div class="dock" role="group" aria-label="Lihat pratinjau sebagai">
  <span>Lihat sebagai</span>
  <button type="button" data-role="peserta" aria-pressed="false">Peserta</button>
  <button type="button" data-role="admin" aria-pressed="false">Admin</button>
</div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------ state
     The role is the only state. It survives a reload where storage
     allows, and ?as=admin or ?as=peserta in a shared link wins. */
  var KEY = 'gamatutor-preview-role';
  function readRole() {
    var q = new URLSearchParams(location.search).get('as');
    if (q === 'admin' || q === 'peserta') return q;
    try { var v = localStorage.getItem(KEY); if (v === 'admin' || v === 'peserta') return v; } catch (e) {}
    return 'peserta';
  }
  var role = readRole();
  function setRole(r) {
    role = r;
    try { localStorage.setItem(KEY, r); } catch (e) {}
    var q = new URLSearchParams(location.search);
    if (q.has('as')) { q.delete('as'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); }
  }

  var USERS = {
    peserta: { name: 'dr. Rina Pratiwi', initials: 'RP', note: 'Peserta contoh' },
    admin: { name: 'Admin SENADA', initials: 'AS', note: 'Admin contoh' }
  };

  /* Sample data. Plausible, clearly invented, and the same everywhere it
     appears so the screens agree with each other. */
  var COHORTS = [
    { name: 'Puskesmas Sleman, Oktober 2026', code: 'SLM-4827', learners: 28, done: 11, starts: '1 Okt 2026', ends: '31 Okt 2026', status: 'Berjalan' },
    { name: 'Puskesmas Bantul, Oktober 2026', code: 'BTL-1906', learners: 22, done: 4, starts: '8 Okt 2026', ends: '7 Nov 2026', status: 'Berjalan' },
    { name: 'Uji coba internal', code: 'UJI-0001', learners: 6, done: 6, starts: '15 Sep 2026', ends: '30 Sep 2026', status: 'Selesai' }
  ];
  var LEARNERS = [
    { name: 'dr. Rina Pratiwi', cohort: 'SLM-4827', module: 'Modul 2', pct: 40, pre: 3, post: null, outcome: 'Berjalan' },
    { name: 'dr. Bagus Santoso', cohort: 'SLM-4827', module: 'Selesai', pct: 100, pre: 2, post: 5, outcome: 'Lulus' },
    { name: 'dr. Sari Wulandari', cohort: 'SLM-4827', module: 'Selesai', pct: 100, pre: 3, post: 4, outcome: 'Lulus' },
    { name: 'dr. Andi Firmansyah', cohort: 'SLM-4827', module: 'Modul 4', pct: 78, pre: 2, post: null, outcome: 'Berjalan' },
    { name: 'dr. Dewi Lestari', cohort: 'BTL-1906', module: 'Selesai', pct: 100, pre: 1, post: 2, outcome: 'Belum lulus' },
    { name: 'dr. Yusuf Hidayat', cohort: 'BTL-1906', module: 'Modul 1', pct: 15, pre: 2, post: null, outcome: 'Berjalan' },
    { name: 'dr. Maya Kurnia', cohort: 'BTL-1906', module: 'Modul 3', pct: 56, pre: 4, post: null, outcome: 'Berjalan' }
  ];
  var FUNNEL = [
    ['Pengantar', 100], ['Modul 1, Diabetes mellitus', 94], ['Modul 2, Retinopati diabetika', 81],
    ['Modul 3, Skrining', 66], ['Modul 4, Simulasi grading', 58], ['Evaluasi', 44], ['Selesai', 38]
  ];
  /* The five grading cases are the course's own (modul4-p2..p6); only the
     percentages are invented. */
  var CASES = [
    { n: 1, level: 'Level 1', answer: 'Tidak ada RD', right: 91 },
    { n: 2, level: 'Level 1', answer: 'Retinopati diabetika', right: 74 },
    { n: 3, level: 'Level 2', answer: 'Observasi', right: 88 },
    { n: 4, level: 'Level 2', answer: 'Rujuk (PDR)', right: 69 },
    { n: 5, level: 'Level 2', answer: 'Rujuk (NPDR sedang)', right: 47 }
  ];

  /* ----------------------------------------------------------- helpers */
  var app = document.getElementById('app');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function soon(slice) { return '<span class="soon">Rencana ' + slice + '</span>'; }
  function head(title, lede, slice, actions) {
    return '<div class="head"><div><h1>' + title + '</h1>' + (lede ? '<p>' + lede + '</p>' : '') +
      '</div><div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">' + (actions || '') + (slice ? soon(slice) : '') + '</div></div>';
  }
  function disabledBtn(label, why) {
    return '<a class="btn" role="button" aria-disabled="true" tabindex="0" data-why="' + esc(why) + '">' + label + '</a>';
  }
  function bar(pct, cls) { return '<div class="bar ' + (cls || '') + '" role="img" aria-label="' + pct + '%"><span style="width:' + pct + '%"></span></div>'; }
  var MARK = '<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13.5" fill="#eaf5f5" stroke="#5bb4b2" stroke-width="1.5"/><circle cx="15" cy="15" r="6" fill="#137a77"/><circle cx="18.5" cy="13" r="2" fill="#f2902e"/></svg>';
  function stateMark(color) {
    return '<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#eaf5f5"/><circle cx="36" cy="36" r="20" fill="none" stroke="' + color + '" stroke-width="3"/><circle cx="36" cy="36" r="7" fill="' + color + '"/></svg>';
  }

  /* ------------------------------------------------------------ routes
     Each route names its audience. 'any' renders in either layout. */
  var ROUTES = {};
  function route(path, who, title, render) { ROUTES[path] = { who: who, title: title, render: render }; }

  /* -- learner ------------------------------------------------------- */
  route('/', 'peserta', 'Kursus saya', function () {
    return head('Selamat datang, dr. Rina', 'Lanjutkan dari halaman terakhir yang Anda buka.', 'S2') +
      '<div class="panel course">' +
        '<div class="course-img"><img src="/courses/drive-retinopati/assets/slide24_3.png" alt=""></div>' +
        '<div><h2>DRIVE: Skrining Retinopati Diabetika</h2>' +
          '<p class="meta">Kohort Puskesmas Sleman, Oktober 2026. Berakhir 31 Okt 2026.</p>' +
          '<div class="progress">' + bar(40) + '<span>40%, terakhir di Modul 2</span></div></div>' +
        '<a class="btn" href="/courses/drive-retinopati/">Lanjutkan</a>' +
      '</div>' +
      '<div class="panel"><h2>Gabung kohort</h2>' +
        '<p class="note" style="margin-top:.3rem">Masukkan kode yang diberikan penyelenggara pelatihan, misalnya <code>SLM-4827</code>.</p>' +
        '<form class="inline" data-mock="Kode kohort belum bisa diproses. Fitur ini direncanakan untuk S2.">' +
          '<input type="text" aria-label="Kode kohort" placeholder="Kode kohort" autocomplete="off">' +
          '<button class="btn" type="submit">Gabung</button></form>' +
        '<p class="flash" hidden></p></div>';
  });

  route('/katalog', 'peserta', 'Katalog', function () {
    return head('Katalog', 'Kursus yang dibuka untuk umum. Kursus untuk kohort tertentu hanya muncul setelah Anda bergabung dengan kodenya.', 'S2') +
      '<div class="grid two">' +
        '<div class="panel"><span class="tag">Kursus native</span><h2 style="margin-top:.6rem">DRIVE: Skrining Retinopati Diabetika</h2>' +
          '<p class="note" style="margin-top:.4rem">4 modul, 32 halaman, simulasi 5 kasus fundus. Bahasa Indonesia.</p>' +
          '<p style="margin-top:1rem"><a class="btn ghost" href="/courses/drive-retinopati/">Buka kursus</a></p></div>' +
        '<div class="panel"><span class="tag grey">Pendamping</span><h2 style="margin-top:.6rem">Atlas anatomi mata 3D</h2>' +
          '<p class="note" style="margin-top:.4rem">20 struktur mata yang bisa diputar dan dipotong. Dipakai di Modul 2.</p>' +
          '<p style="margin-top:1rem"><a class="btn ghost" href="/anatomi-mata/">Buka atlas</a></p></div>' +
      '</div>';
  });

  route('/sertifikat', 'peserta', 'Sertifikat', function () {
    return head('Sertifikat', null, 'S3') +
      '<div class="state">' + stateMark('#5bb4b2') +
        '<h1>Belum ada sertifikat</h1>' +
        '<p>Sertifikat terbit otomatis saat Anda lulus evaluasi DRIVE dengan nilai minimal 60. Setiap sertifikat punya nomor seri yang bisa diperiksa siapa pun.</p>' +
        '<div class="actions"><a class="btn" href="/courses/drive-retinopati/">Lanjutkan DRIVE</a><a class="btn ghost" href="#/verifikasi">Periksa nomor seri</a></div></div>';
  });

  route('/profil', 'peserta', 'Profil', function () {
    return head('Profil', 'Nama di sini dipakai pada sertifikat. Sertifikat yang sudah terbit tidak ikut berubah.', 'S1') +
      '<div class="panel" style="max-width:560px">' +
        '<div class="field"><label for="pn">Nama lengkap dengan gelar</label><input id="pn" type="text" value="dr. Rina Pratiwi"></div>' +
        '<div class="field"><label for="pe">Email</label><input id="pe" type="email" value="rina.pratiwi@contoh.id"></div>' +
        '<p style="margin-top:1.25rem">' + disabledBtn('Simpan perubahan', 'Akun belum tersedia. Direncanakan untuk S1.') + '</p>' +
        '<p class="flash" hidden></p></div>';
  });

  /* -- admin --------------------------------------------------------- */
  route('/admin', 'admin', 'Ringkasan', function () {
    var active = COHORTS.filter(function (c) { return c.status === 'Berjalan'; });
    var learners = active.reduce(function (a, c) { return a + c.learners; }, 0);
    var done = active.reduce(function (a, c) { return a + c.done; }, 0);
    return head('Ringkasan', 'Kohort yang sedang berjalan untuk DRIVE.', 'S2') +
      '<dl class="stats">' +
        '<div class="stat"><dt>Kohort berjalan</dt><dd>' + active.length + '</dd></div>' +
        '<div class="stat"><dt>Peserta terdaftar</dt><dd>' + learners + '</dd></div>' +
        '<div class="stat"><dt>Sudah selesai</dt><dd>' + done + '<small>' + Math.round(done / learners * 100) + '%</small></dd></div>' +
        '<div class="stat"><dt>Kasus tersulit</dt><dd>Kasus 5<small>47% tepat</small></dd></div>' +
      '</dl>' +
      '<div class="grid two">' +
        '<div class="panel"><h2>Kohort berjalan</h2><div class="scroll"><table style="margin-top:.6rem"><thead><tr><th>Kohort</th><th class="num">Selesai</th></tr></thead><tbody>' +
          active.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td class="num">' + c.done + ' / ' + c.learners + '</td></tr>'; }).join('') +
        '</tbody></table></div><p style="margin-top:1rem"><a href="#/admin/kohort">Kelola kohort</a></p></div>' +
        '<div class="panel"><h2>Perlu perhatian</h2><ul style="margin:.6rem 0 0;padding-left:1.1rem;color:var(--ink-soft)">' +
          '<li>Hanya 47% peserta tepat pada kasus 5 (NPDR sedang, rujuk). <a href="#/admin/analitik">Lihat analitik</a></li>' +
          '<li style="margin-top:.4rem">dr. Dewi Lestari selesai tetapi belum lulus (2 dari 5). <a href="#/admin/nilai">Lihat nilai</a></li>' +
          '<li style="margin-top:.4rem">Kohort Bantul baru 4 dari 22 peserta yang selesai.</li></ul></div>' +
      '</div>';
  });

  route('/admin/kursus', 'admin', 'Kursus', function () {
    return head('Kursus', 'Setiap unggahan menjadi versi baru. Kohort yang sedang berjalan tetap memakai versi yang dipilih saat dibuat.', 'S2',
        disabledBtn('Unggah kursus', 'Unggah paket native atau SCORM direncanakan untuk S2 dan S4.')) +
      '<p class="flash" hidden></p>' +
      '<div class="panel"><div class="scroll"><table><thead><tr><th>Kursus</th><th>Jenis</th><th>Versi</th><th>Status</th><th class="num">Kohort</th></tr></thead><tbody>' +
        '<tr><td><strong>DRIVE: Skrining Retinopati Diabetika</strong><br><span class="note">drive-retinopati</span></td><td><span class="tag">Native</span></td><td>v2, 8 Okt 2026<br><span class="note">menambah model 3D</span></td><td><span class="tag">Terbit</span></td><td class="num">3</td></tr>' +
        '<tr><td>DRIVE: Skrining Retinopati Diabetika</td><td><span class="tag">Native</span></td><td>v1, 5 Sep 2026</td><td><span class="tag grey">Arsip</span></td><td class="num">1</td></tr>' +
      '</tbody></table></div></div>';
  });

  route('/admin/kohort', 'admin', 'Kohort', function () {
    return head('Kohort', 'Satu kohort adalah satu kelas: satu versi kursus, satu kode gabung, satu jadwal.', 'S2',
        disabledBtn('Buat kohort', 'Pembuatan kohort direncanakan untuk S2.')) +
      '<p class="flash" hidden></p>' +
      '<div class="panel"><div class="scroll"><table><thead><tr><th>Kohort</th><th>Kode gabung</th><th>Jadwal</th><th class="num">Peserta</th><th>Status</th></tr></thead><tbody>' +
        COHORTS.map(function (c) {
          return '<tr><td>' + esc(c.name) + '</td><td><code>' + c.code + '</code></td><td>' + c.starts + ' sampai ' + c.ends + '</td><td class="num">' + c.learners + '</td><td><span class="tag ' + (c.status === 'Selesai' ? 'grey' : '') + '">' + c.status + '</span></td></tr>';
        }).join('') +
      '</tbody></table></div></div>';
  });

  route('/admin/peserta', 'admin', 'Peserta', function () {
    return head('Peserta', 'Semua akun yang terdaftar di kohort mana pun.', 'S1',
        disabledBtn('Undang peserta', 'Undangan lewat email direncanakan untuk S1.')) +
      '<p class="flash" hidden></p>' +
      '<div class="panel"><div class="scroll"><table><thead><tr><th>Nama</th><th>Kohort</th><th>Posisi</th><th>Progres</th></tr></thead><tbody>' +
        LEARNERS.map(function (l) {
          return '<tr><td>' + esc(l.name) + '</td><td><code>' + l.cohort + '</code></td><td>' + l.module + '</td><td style="width:30%">' + bar(l.pct) + '</td></tr>';
        }).join('') +
      '</tbody></table></div></div>';
  });

  route('/admin/nilai', 'admin', 'Nilai', function () {
    return head('Nilai', 'Pre-test dan post-test, 5 soal. Nilai lulus 60, yaitu 3 dari 5.', 'S3',
        disabledBtn('Unduh XLSX', 'Ekspor nilai direncanakan untuk S3.') + disabledBtn('Unduh CSV', 'Ekspor nilai direncanakan untuk S3.')) +
      '<p class="flash" hidden></p>' +
      '<div class="panel"><div class="scroll"><table><thead><tr><th>Nama</th><th>Kohort</th><th class="num">Pre-test</th><th class="num">Post-test</th><th>Hasil</th></tr></thead><tbody>' +
        LEARNERS.map(function (l) {
          var cls = l.outcome === 'Lulus' ? '' : l.outcome === 'Belum lulus' ? 'amber' : 'grey';
          return '<tr><td>' + esc(l.name) + '</td><td><code>' + l.cohort + '</code></td><td class="num">' + l.pre + ' / 5</td><td class="num">' + (l.post === null ? '&ndash;' : l.post + ' / 5') + '</td><td><span class="tag ' + cls + '">' + l.outcome + '</span></td></tr>';
        }).join('') +
      '</tbody></table></div></div>';
  });

  route('/admin/analitik', 'admin', 'Analitik', function () {
    return head('Analitik', 'Kohort Sleman dan Bantul, Oktober 2026. Angka ini tidak bisa didapat dari SCORM biasa: dihitung dari setiap klik peserta.', 'S5') +
      '<div class="panel"><h2>Sampai di mana peserta berhenti</h2><p class="note" style="margin:.3rem 0 1rem">Persentase peserta yang membuka setiap modul.</p><div class="funnel">' +
        FUNNEL.map(function (f) { return '<div><span>' + f[0] + '</span>' + bar(f[1]) + '<span class="num" style="text-align:right">' + f[1] + '%</span></div>'; }).join('') +
      '</div></div>' +
      '<div class="panel"><h2>Simulasi grading, jawaban tepat pada percobaan pertama</h2><p class="note" style="margin:.3rem 0 1rem">Lima kasus Modul 4. Di bawah 60% ditandai jingga.</p><div class="scroll"><table><thead><tr><th>Kasus</th><th>Level</th><th>Jawaban kursus</th><th style="width:35%">Tepat</th><th class="num">%</th></tr></thead><tbody>' +
        CASES.map(function (c) { return '<tr><td>Kasus ' + c.n + '</td><td>' + c.level + '</td><td>' + c.answer + '</td><td>' + bar(c.right, c.right < 60 ? 'amber' : '') + '</td><td class="num">' + c.right + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  });

  /* -- either -------------------------------------------------------- */
  route('/masuk', 'any', 'Masuk', function () {
    return '<div class="login"><div class="panel"><h1>Masuk ke GamaTutor</h1>' +
      '<p class="note" style="margin-top:.4rem">Akun belum tersedia (rencana S1). Pilih peran di bawah untuk melihat tampilannya.</p>' +
      '<div class="field" style="margin-top:1.25rem"><label for="le">Email</label><input id="le" type="email" placeholder="nama@contoh.id"></div>' +
      '<div class="field"><label for="lp">Kata sandi</label><input id="lp" type="password"></div>' +
      '<div class="roles"><button class="btn" type="button" data-login="peserta">Masuk sebagai peserta</button><button class="btn ghost" type="button" data-login="admin">Masuk sebagai admin</button></div>' +
      '</div></div>';
  });

  route('/verifikasi', 'any', 'Periksa sertifikat', function () {
    return head('Periksa sertifikat', 'Halaman publik. Siapa pun bisa memeriksa nomor seri tanpa masuk, dan hanya melihat isi sertifikatnya.', 'S3') +
      '<div class="panel" style="max-width:560px"><form class="inline" data-mock="Pemeriksaan nomor seri direncanakan untuk S3.">' +
        '<input type="text" aria-label="Nomor seri" placeholder="Contoh: DRV-2026-000128"><button class="btn" type="submit">Periksa</button></form>' +
      '<p class="flash" hidden></p></div>';
  });

  /* --------------------------------------------------------- layouts */
  var NAV = {
    peserta: [['/', 'Kursus saya'], ['/katalog', 'Katalog'], ['/sertifikat', 'Sertifikat'], ['/profil', 'Profil']],
    admin: [['/admin', 'Ringkasan', 'S2'], ['/admin/kursus', 'Kursus', 'S2'], ['/admin/kohort', 'Kohort', 'S2'],
            ['/admin/peserta', 'Peserta', 'S1'], ['/admin/nilai', 'Nilai', 'S3'], ['/admin/analitik', 'Analitik', 'S5']]
  };
  function navLinks(list, path, withSlice) {
    return list.map(function (n) {
      return '<a href="#' + n[0] + '"' + (n[0] === path ? ' aria-current="page"' : '') + '>' + n[1] +
        (withSlice && n[2] ? '<span class="slice">' + n[2] + '</span>' : '') + '</a>';
    }).join('');
  }
  function learnerLayout(path, body) {
    var u = USERS.peserta;
    return '<header class="topbar"><a class="logo" href="#/">' + MARK + 'GamaTutor</a>' +
      '<nav class="topnav" aria-label="Menu peserta">' + navLinks(NAV.peserta, path) + '</nav>' +
      '<div class="who"><span>' + u.name + '</span><span class="avatar" aria-hidden="true">' + u.initials + '</span></div></header>' +
      '<main class="learner-main" id="main">' + body + '</main>';
  }
  function adminLayout(path, body) {
    var u = USERS.admin;
    return '<div class="admin"><aside class="side"><a class="logo" href="#/admin">' + MARK + 'GamaTutor <span class="role-badge">Admin</span></a>' +
      '<nav class="sidenav" aria-label="Menu admin">' + navLinks(NAV.admin, path, true) + '</nav>' +
      '<div class="side-foot">' + u.name + '<br>' + u.note + '</div></aside>' +
      '<main class="admin-main" id="main">' + body + '</main></div>';
  }

  /* The two non-pages: a path that does not exist, and a path the current
     role may not see. Both say what happened and offer a way on. */
  function notFound(path) {
    return '<div class="state">' + stateMark('#6b8196') + '<h1>Halaman ini belum ada</h1>' +
      '<p>Alamat <code>' + esc(path) + '</code> tidak dikenal di pratinjau ini. Mungkin fiturnya belum dirancang.</p>' +
      '<div class="actions"><a class="btn" href="#' + (role === 'admin' ? '/admin' : '/') + '">Kembali ke beranda</a></div></div>';
  }
  function forbidden(r) {
    return '<div class="state">' + stateMark('#f2902e') + '<h1>' + (r.who === 'admin' ? 'Khusus admin' : 'Halaman untuk peserta') + '</h1>' +
      '<p>' + (r.who === 'admin'
        ? 'Halaman ' + r.title + ' hanya bisa dibuka oleh admin. Peserta tidak melihat menu ini.'
        : 'Halaman ' + r.title + ' adalah tampilan peserta. Admin mengelola dari panel admin.') + '</p>' +
      '<div class="actions"><a class="btn" href="#' + (role === 'admin' ? '/admin' : '/') + '">Ke beranda saya</a>' +
      '<button class="btn ghost" type="button" data-switch="' + r.who + '">Lihat sebagai ' + (r.who === 'admin' ? 'admin' : 'peserta') + '</button></div></div>';
  }

  function render() {
    var path = (location.hash.replace(/^#/, '') || '/').replace(/\/+$/, '') || '/';
    var r = ROUTES[path];
    var body, title;
    if (!r) { body = notFound(path); title = 'Tidak ditemukan'; }
    else if (r.who !== 'any' && r.who !== role) { body = forbidden(r); title = r.title; }
    else { body = r.render(); title = r.title; }

    app.innerHTML = role === 'admin' ? adminLayout(path, body) : learnerLayout(path, body);
    document.title = title + ' · GamaTutor pratinjau';
    Array.prototype.forEach.call(document.querySelectorAll('.dock button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.role === role));
    });
  }

  /* ------------------------------------------------------- behaviour */
  function flash(from, text) {
    var box = from.closest('.panel, .admin-main, .learner-main').querySelector('.flash');
    if (box) { box.textContent = text; box.hidden = false; }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-role], [data-switch], [data-login], [aria-disabled="true"]');
    if (!t) return;
    if (t.dataset.role || t.dataset.switch) {
      setRole(t.dataset.role || t.dataset.switch);
      if (t.dataset.role) location.hash = role === 'admin' ? '#/admin' : '#/';
      render();
    } else if (t.dataset.login) {
      setRole(t.dataset.login);
      location.hash = role === 'admin' ? '#/admin' : '#/';
    } else {
      e.preventDefault();
      flash(t, t.dataset.why);
    }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('aria-disabled') === 'true') {
      e.preventDefault(); flash(t, t.dataset.why);
    }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.dataset.mock) { e.preventDefault(); flash(f, f.dataset.mock); }
  });

  window.addEventListener('hashchange', function () {
    render();
    var main = document.getElementById('main');
    if (main) { main.setAttribute('tabindex', '-1'); main.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  });
  render();
})();
</script>
</body>
</html>
