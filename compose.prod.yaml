services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lms-network

  # Distributed Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lms-network

  # S3-compatible Object Storage for Uploads & Thumbnails
  rustfs:
    image: rustfs/rustfs:latest
    container_name: lms-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  # Single container: Fastify serves the API (/api/v1, /api/auth, /docs) AND the SPA
  lms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms
    restart: unless-stopped
    ports:
      - "3000:8000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lms}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - DEV_MODE=${DEV_MODE:-false}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://rustfs:9000
      - S3_BUCKET=${S3_BUCKET:-lms-uploads}
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-rustfsadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-rustfsadmin}
      - S3_FORCE_PATH_STYLE=true
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-replace-with-a-real-secret-at-least-32-chars-long}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-${BETTER_AUTH_URL:-http://localhost:3000}}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  postgres_data:
    name: lms_postgres_data
  rustfs_data:
    name: lms_rustfs_data
